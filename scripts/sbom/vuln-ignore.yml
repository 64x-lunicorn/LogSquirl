# Accepted vulnerability risks of the components LogSquirl ships (#213).
#
# scripts/sbom/logsquirl_vulns.py marks a finding as ignored while an entry
# here matches it: no release failure for a critical one, and the daily scan
# dismisses its code scanning alert with the reason below and reopens it once
# the entry expires (#415). Every entry needs all four keys:
#
#   id         CVE, GHSA or OSV id; aliases of a finding match too
#   component  component name as in the SBOM (qt, openssl, zstd, ...)
#   reason     why the risk is accepted: not reachable, fix not released, ...
#   expires    YYYY-MM-DD; after that day the entry stops suppressing the
#              finding and the scan warns, so the decision is taken again
#
# Example:
#
#   - id: CVE-2026-12345
#     component: openssl
#     reason: >-
#       Only affects the QUIC server; LogSquirl uses OpenSSL as a TLS client.
#     expires: 2026-12-31
ignore:
  - id: CVE-2026-15037
    component: qt
    reason: >-
      Fixed only in Qt 6.12.0, which is not released (#251). The flaw lets text
      placed into QDom comment, CDATA or processing-instruction nodes inject
      markup when serialized. LogSquirl's Scratchpad re-serializes XML the user
      pasted for display back to that same user, so no trust boundary is
      crossed. Revisit with the Qt 6.12 upgrade.
    expires: 2027-03-31
