# Accepted vulnerability risks of the components LogSquirl ships (#213) and of
# the website's npm packages (#772).
#
# scripts/sbom/logsquirl_vulns.py marks a finding as ignored while an entry
# here matches it: no release failure for a critical one, and the daily scan
# dismisses its code scanning alert with the reason below and reopens it once
# the entry expires (#415); for the website, no failure of CI's Website job.
# Every entry needs all four keys:
#
#   id         CVE, GHSA or OSV id; aliases of a finding match too
#   component  component name as in the SBOM (qt, openssl, zstd, ...), or the
#              npm package name (postcss-selector-parser, @img/sharp-wasm32)
#   reason     why the risk is accepted: not reachable, fix not released, ...
#   expires    YYYY-MM-DD; after that day the entry stops suppressing the
#              finding and the scan warns, so the decision is taken again
#
# Example:
#
#   - id: CVE-2026-12345
#     component: openssl
#     reason: >-
#       Only affects the QUIC server; LogSquirl uses OpenSSL as a TLS client.
#     expires: 2026-12-31
ignore:
  - id: CVE-2026-15037
    component: qt
    reason: >-
      Fixed only in Qt 6.12.0, which is not released (#251). The flaw lets text
      placed into QDom comment, CDATA or processing-instruction nodes inject
      markup when serialized. LogSquirl's Scratchpad re-serializes XML the user
      pasted for display back to that same user, so no trust boundary is
      crossed. Revisit with the Qt 6.12 upgrade.
    expires: 2027-03-31
  - id: CVE-2026-76844
    component: zlib_sources
    reason: >-
      The flaw is in gzwrite(), zlib's gzopen() file API. LogSquirl builds zlib
      without the gz* files (3rdparty/CMakeLists.txt): KArchive inflates and
      deflates streams and nothing calls the file API. No zlib release fixes it
      yet; take the release that does.
    expires: 2027-01-31
  - id: CVE-2026-85091
    component: zlib_sources
    reason: >-
      The flaw is in gz_vacate(), zlib's gzopen() file API. LogSquirl builds
      zlib without the gz* files (3rdparty/CMakeLists.txt): KArchive inflates
      and deflates streams and nothing calls the file API. No zlib release
      fixes it yet; take the release that does.
    expires: 2027-01-31
  - id: OSV-2022-1174
    component: KArchive
    reason: >-
      An OSS-Fuzz crash of 2022 in liblzma's crc64_clmul, reached through
      KArchive's fuzzer; the code is xz's, and LogSquirl ships xz 5.8.4. OSV
      gives only a commit range on KArchive's kf5 branch, whose "fix" is a
      translation sync, so it cannot rule out a KF6 release.
    expires: 2027-10-31
