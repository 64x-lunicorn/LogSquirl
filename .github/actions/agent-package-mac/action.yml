name: "Prepare logsquirl mac packages"
description: "Deploy Qt into the macOS app bundle and package it, unsigned, as a DMG and app/dSYM archives"

# Every CI Build run packages unsigned, on any branch and event: the build
# never sees a signing secret. CI Release signs, notarizes and staples these
# packages inside the `release` environment (.github/actions/mac-sign-notarize,
# #203).
runs:
  using: "composite"
  steps:
    # ── 1. Prepare the .app bundle ────────────────────────────────────────
    - name: Mac create PkgInfo
      shell: sh
      run: |
        printf 'APPL????' > $LOGSQUIRL_BUILD_ROOT/output/logsquirl.app/Contents/PkgInfo

    - name: Mac deploy Qt
      shell: sh
      run: |
        set -eu
        cd $LOGSQUIRL_BUILD_ROOT
        macdeployqt ./output/logsquirl.app -always-overwrite -verbose=2

    - name: Mac deploy Qt fixing
      shell: sh
      run: |
        python3 $LOGSQUIRL_BUILD_ROOT/macdeployqtfix.py \
          $LOGSQUIRL_BUILD_ROOT/output/logsquirl.app/Contents/MacOS/logsquirl \
          $LOGSQUIRL_QT_DIR

    # ── 1b. Repair Qt framework bundle symlinks ──────────────────────────
    - name: Mac fix framework symlinks
      shell: sh
      env:
        WORKSPACE: ${{ github.workspace }}
      run: |
        "$WORKSPACE/scripts/fix_macos_frameworks.sh" \
          "$LOGSQUIRL_BUILD_ROOT/output/logsquirl.app"

    # ── 2. Create the (unsigned) DMG ──────────────────────────────────────
    - name: Mac create DMG
      uses: ./.github/actions/mac-create-dmg
      with:
        app: ${{ env.LOGSQUIRL_BUILD_ROOT }}/output/logsquirl.app
        dmg: ${{ env.LOGSQUIRL_BUILD_ROOT }}/packages/logsquirl-mac-${{ env.LOGSQUIRL_ARCH }}.dmg

    # ── 3. Archive app and symbols for CI artifacts ───────────────────────
    #
    # GitHub Actions upload-artifact uses ZIP which destroys symlinks.
    # We tar.gz the .app and .dSym to preserve the framework symlink
    # structure. Without this, downloaded artifacts have broken frameworks
    # and fail Gatekeeper verification. CI Release signs the app from this
    # archive.
    - name: Mac archive app and symbols
      shell: sh
      run: |
        set -eu
        cd $LOGSQUIRL_BUILD_ROOT
        tar -czf "./packages/logsquirl-$LOGSQUIRL_ARCH.app.tar.gz" -C ./output logsquirl.app
        tar -czf "./packages/logsquirl-$LOGSQUIRL_ARCH.dSym.tar.gz" -C ./output logsquirl.dSym
