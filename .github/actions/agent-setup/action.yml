name: "Setup agent"
description: "Install the native build tooling: Ninja, sccache, Qt and Boost"
runs:
  using: "composite"
  steps:
    # Every tool below has an explicit version, and every direct download is
    # checked against a SHA-256 that fails the step on mismatch (#199). Each
    # version and its hashes live in the one step that uses them.
    - name: Install Ninja
      shell: bash
      env:
        # renovate: datasource=github-releases depName=ninja-build/ninja
        NINJA_VERSION: 1.13.2
        NINJA_SHA256_WINDOWS: 07fc8261b42b20e71d1720b39068c2e14ffcee6396b76fb7a795fb460b78dc65
        NINJA_SHA256_MACOS: c99048673aa765960a99cf10c6ddb9f1fad506099ff0a0e137ad8960a88f321b
        NINJA_SHA256_LINUX: 5749cbc4e668273514150a80e387a957f933c6ed3f5f11e03fb30955e2bbead6
      # GITHUB_PATH gets a directory under RUNNER_TEMP named after the pinned
      # version, never untrusted input (#204).
      run: | # zizmor: ignore[github-env]
        # The official release zip instead of choco/brew/apt, which cannot pin
        # a version; curl retries cover the flaky downloads that once made us
        # drop seanmiddleditch/gha-setup-ninja.
        set -euo pipefail
        case "$RUNNER_OS" in
          Windows) asset=ninja-win.zip;   sha256=$NINJA_SHA256_WINDOWS ;;
          macOS)   asset=ninja-mac.zip;   sha256=$NINJA_SHA256_MACOS ;;
          *)       asset=ninja-linux.zip; sha256=$NINJA_SHA256_LINUX ;;
        esac
        ninja_dir="$RUNNER_TEMP/ninja-$NINJA_VERSION"
        mkdir -p "$ninja_dir"
        curl --fail --silent --show-error --location --retry 5 --retry-all-errors \
          --output "$ninja_dir/$asset" \
          "https://github.com/ninja-build/ninja/releases/download/v$NINJA_VERSION/$asset"
        # cmake is on every runner and hashes the same way on all three,
        # unlike sha256sum (BSD flavour on macOS, path escaping on Windows).
        actual=$(cmake -E sha256sum "$ninja_dir/$asset")
        actual=${actual%% *}
        if [ "$actual" != "$sha256" ]; then
          echo "::error::$asset SHA-256 mismatch: expected $sha256, got $actual"
          exit 1
        fi
        (cd "$ninja_dir" && cmake -E tar xf "$asset" && rm "$asset")
        echo "$ninja_dir" >> "$GITHUB_PATH"
        "$ninja_dir/ninja" --version

    # Compiler cache for the native (non-container) builds. The action puts
    # sccache on PATH, exports SCCACHE_PATH and forwards the Actions cache
    # credentials (ACTIONS_RESULTS_URL / ACTIONS_RUNTIME_TOKEN) so the GitHub
    # Actions cache backend works. Linux builds run inside docker containers
    # and never see this step (see #119 for the container path).
    - name: Install sccache
      if: runner.os != 'Linux'
      uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      with:
        # Without it the action fetches whatever sccache release is latest (#199).
        version: v0.18.0

    - name: Enable sccache GitHub Actions cache backend
      if: runner.os != 'Linux'
      shell: bash
      env:
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      run: |
        set -euo pipefail
        echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
        # Bump to invalidate every cached object at once.
        echo "SCCACHE_GHA_VERSION=1" >> "$GITHUB_ENV"
        # Every object is its own cache entry; a pull request wrote ~380
        # entries (~210 MB) scoped to its ref that no other branch can read.
        # Only the default branch writes, as for the Linux sccache (#219).
        if [ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
          echo "SCCACHE_GHA_RW_MODE=READ_ONLY" >> "$GITHUB_ENV"
        fi

    - name: Install Qt
      if: ${{ matrix.config.qt_arch }}
      uses: jurplel/install-qt-action@bcb88e3bed2e992f5f9e24c0f9e364a231d278eb # v4.4.0
      with:
        version: ${{ matrix.config.qt_version }}
        arch: ${{ matrix.config.qt_arch }}
        cache: true
        cache-key-prefix: ${{ matrix.config.os }}-${{ matrix.config.arch }}-${{ matrix.config.qt_version }}-QtCache
        modules: ${{ matrix.config.qt_modules }}
        archives: qtbase qtimageformats qtsvg qttools qttranslations icu
        # The action defaults to a floating ==3.3.*; pin the installer (#199).
        # py7zr repeats the action's own pin (a Bad7zFile workaround on
        # Windows) so both installer packages are visible here.
        aqtversion: ==3.3.0
        py7zrversion: ==1.1.0

    # Boost comes from the Boost project's own archive host instead of
    # SourceForge's mirror redirects, verified against the SHA-256 the Boost
    # project publishes next to the tarball (#199).
    # Only literals and the workspace path reach GITHUB_ENV (#204).
    - name: Set boost env vars
      shell: sh
      env:
        WORKSPACE: ${{ github.workspace }}
      run: | # zizmor: ignore[github-env]
        set -eu
        # renovate: datasource=github-tags depName=boostorg/boost extractVersion=^boost-(?<version>.*)$
        BOOST_VERSION="1.86.0"
        BOOST_SHA256="1bed88e40401b2cb7a1f76d4bab499e352fa4d0c5f31c0dbae64e24d34d7513b"
        BOOST_VERSION_UNDERSCORE=$(echo "$BOOST_VERSION" | tr '.' '_')
        echo "BOOST_ROOT=$WORKSPACE/3rdparty/boost" >> $GITHUB_ENV
        echo "BOOST_URL=https://archives.boost.io/release/${BOOST_VERSION}/source/boost_${BOOST_VERSION_UNDERSCORE}.tar.bz2" >> $GITHUB_ENV
        echo "BOOST_SHA256=$BOOST_SHA256" >> $GITHUB_ENV
        echo "BOOST_VERSION=$BOOST_VERSION" >> $GITHUB_ENV

    - name: Restore Boost cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      id: cache-boost
      with:
        path: ${{env.BOOST_ROOT}}
        # The hash in the key ties the cached tree to the verified tarball, so
        # this change starts from a cold cache instead of the unverified one.
        key: boost-${{ runner.os }}-${{ env.BOOST_VERSION }}-${{ env.BOOST_SHA256 }}

    - name: Install Boost
      shell: bash
      env:
        BOOST_CACHE_HIT: ${{ steps.cache-boost.outputs.cache-hit }}
      run: |
        set -euo pipefail
        if echo "$BOOST_CACHE_HIT" | grep -c "true"
        then
          echo "Using boost from cache"
        else
          echo "Downloading boost"
          # OS is only defined on Windows runners.
          if [ "${OS:-}" == "Windows_NT" ]; then
            # fix up paths to be forward slashes consistently
            BOOST_ROOT=$(echo $BOOST_ROOT | sed 's/\\/\//g')
          fi
          mkdir -p $BOOST_ROOT
          curl --fail --silent --show-error --location --retry 5 --retry-all-errors \
            --output $BOOST_ROOT/download.tar.bz2 $BOOST_URL
          actual=$(cmake -E sha256sum "$BOOST_ROOT/download.tar.bz2")
          actual=${actual%% *}
          if [ "$actual" != "$BOOST_SHA256" ]; then
            echo "::error::Boost tarball SHA-256 mismatch: expected $BOOST_SHA256, got $actual"
            exit 1
          fi
          7z -o$BOOST_ROOT x $BOOST_ROOT/download.tar.bz2 -y -bd
          7z -o$BOOST_ROOT x $BOOST_ROOT/download.tar -y -bd
          cd $BOOST_ROOT && cp -r boost_*/* .
          rm -rf boost_*/* download.tar.bz2 download.tar
        fi
        


