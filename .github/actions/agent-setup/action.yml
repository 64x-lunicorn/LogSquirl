name: "Setup agent"
description: "Install the native build tooling: Ninja, sccache, Qt and Boost"
runs:
  using: "composite"
  steps:
    - name: Install Ninja
      shell: bash
      run: |
        # Install Ninja via the platform's package manager to avoid the fragile
        # zip-download in seanmiddleditch/gha-setup-ninja which occasionally
        # returns a corrupt archive ("No END header found").
        if [ "$RUNNER_OS" = "Windows" ]; then
          choco install ninja --no-progress -y
        elif [ "$RUNNER_OS" = "macOS" ]; then
          brew install ninja
        else
          sudo apt-get install -y ninja-build
        fi

    # Compiler cache for the native (non-container) builds. The action puts
    # sccache on PATH, exports SCCACHE_PATH and forwards the Actions cache
    # credentials (ACTIONS_RESULTS_URL / ACTIONS_RUNTIME_TOKEN) so the GitHub
    # Actions cache backend works. Linux builds run inside docker containers
    # and never see this step (see #119 for the container path).
    - name: Install sccache
      if: runner.os != 'Linux'
      uses: mozilla-actions/sccache-action@v0.0.11

    - name: Enable sccache GitHub Actions cache backend
      if: runner.os != 'Linux'
      shell: bash
      run: |
        echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
        # Bump to invalidate every cached object at once.
        echo "SCCACHE_GHA_VERSION=1" >> "$GITHUB_ENV"

    - name: Install Qt
      if: ${{ matrix.config.qt_arch }}
      uses: jurplel/install-qt-action@v4
      with:
        version: ${{ matrix.config.qt_version }}
        arch: ${{ matrix.config.qt_arch }}
        cache: true
        cache-key-prefix: ${{ matrix.config.os }}-${{ matrix.config.arch }}-${{ matrix.config.qt_version }}-QtCache
        modules: ${{ matrix.config.qt_modules }}
        archives: qtbase qtimageformats qtsvg qttools qttranslations icu

    - name: Set boost env vars
      shell: sh
      run: |
        BOOST_VERSION="1.86.0"
        BOOST_VERSION_UNDERSCORE=$(echo "$BOOST_VERSION" | tr '.' '_')
        echo "BOOST_ROOT=${{github.workspace}}/3rdparty/boost" >> $GITHUB_ENV
        echo "BOOST_URL=https://sourceforge.net/projects/boost/files/boost/${BOOST_VERSION}/boost_${BOOST_VERSION_UNDERSCORE}.tar.bz2/download" >> $GITHUB_ENV
        echo "BOOST_VERSION=$BOOST_VERSION" >> $GITHUB_ENV

    - name: Restore Boost cache
      uses: actions/cache@v4
      id: cache-boost
      with:
        path: ${{env.BOOST_ROOT}}
        key: boost-${{ runner.os }}-${{ env.BOOST_VERSION }}

    - name: Install Boost
      shell: bash
      run: |
        if echo ${{ steps.cache-boost.outputs.cache-hit }} | grep -c "true"
        then
          echo "Using boost from cache"
        else
          echo "Downloading boost"
          if [ "$OS" == "Windows_NT" ]; then
            # fix up paths to be forward slashes consistently
            BOOST_ROOT=$(echo $BOOST_ROOT | sed 's/\\/\//g')
          fi
          mkdir -p $BOOST_ROOT
          curl --progress-bar --location --output $BOOST_ROOT/download.tar.bz2 $BOOST_URL
          7z -o$BOOST_ROOT x $BOOST_ROOT/download.tar.bz2 -y -bd
          7z -o$BOOST_ROOT x $BOOST_ROOT/download.tar -y -bd
          cd $BOOST_ROOT && cp -r boost_*/* .
          rm -rf boost_*/* download.tar.bz2 download.tar
        fi
        


