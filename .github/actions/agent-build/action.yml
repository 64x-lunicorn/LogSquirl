name: "Configure and build"
description: "Generate the build files and build the code"
runs:
  using: "composite"
  steps:

    - name: Prepare compiler env
      shell: sh
      run: |
        # `shell: sh` only runs with -e; -u also catches a misspelt variable,
        # and each step of more than one command sets it (#218).
        set -eu
        echo "CC=${{ matrix.config.cc }}" >> $GITHUB_ENV
        echo "CXX=${{ matrix.config.cxx }}" >> $GITHUB_ENV

    # The key covers the CPM script as well as the package list: a CPM update
    # can change how sources are laid out in the cache (#219).
    - name: Restore CPM cache
      id: cpm_cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ github.workspace }}/cpm_cache
        key: cpm-${{ runner.os }}-${{ matrix.config.arch }}-${{ hashFiles('3rdparty/CMakeLists.txt', 'cmake/CPM.cmake') }}
        restore-keys: |
          cpm-${{ runner.os }}-${{ matrix.config.arch }}-

    - name: configure
      shell: sh
      run: |
        set -eu
        # sccache is installed and enabled by agent-setup. It is wired in as
        # the CMake compiler launcher so the project's own build files stay
        # untouched.
        LAUNCHER_OPTS=""
        if [ "${SCCACHE_GHA_ENABLED:-}" = "true" ]; then
          LAUNCHER_OPTS="-DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache"
          if [ "$RUNNER_OS" = "Windows" ]; then
            # sccache cannot cache MSVC objects compiled with /Zi (the debug
            # info goes into a per-target PDB shared by many objects). Embed
            # it into the objects instead (/Z7); the linker still writes the
            # executable's PDB, so the pdb zip in prepare_release.cmd is
            # unaffected. CMAKE_MSVC_DEBUG_INFORMATION_FORMAT only takes
            # effect under policy CMP0141 NEW, which this project's
            # cmake_minimum_required(3.12) does not enable on its own.
            LAUNCHER_OPTS="$LAUNCHER_OPTS -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded -DCMAKE_POLICY_DEFAULT_CMP0141=NEW"
          fi
        fi
        mkdir $LOGSQUIRL_BUILD_ROOT
        cd $LOGSQUIRL_BUILD_ROOT
        cmake $LOGSQUIRL_CMAKE_OPTS $LAUNCHER_OPTS -DCPM_SOURCE_CACHE=$LOGSQUIRL_WORKSPACE/cpm_cache -DLOGSQUIRL_OVERRIDE_MALLOC=OFF $LOGSQUIRL_WORKSPACE

    - name: build
      shell: sh
      run: |
        cmake --build $LOGSQUIRL_BUILD_ROOT -t ci_build

    # A pull request that changes the dependencies would otherwise add a
    # ~400 MB entry scoped to its own ref; only the default branch saves, and
    # only when the exact key was missing (caches are immutable) (#219).
    - name: Save CPM cache
      if: >-
        steps.cpm_cache.outputs.cache-hit != 'true'
        && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ github.workspace }}/cpm_cache
        key: ${{ steps.cpm_cache.outputs.cache-primary-key }}

    - name: sccache stats
      if: always()
      shell: bash
      env:
        BUILD_NAME: ${{ runner.os }} / ${{ matrix.config.arch }}
      run: |
        set -euo pipefail
        if [ "${SCCACHE_GHA_ENABLED:-}" = "true" ] && command -v sccache >/dev/null 2>&1; then
          sccache --show-stats | "$GITHUB_WORKSPACE/.github/scripts/sccache-stats-summary.sh" "$BUILD_NAME"
        else
          echo "sccache not enabled on this runner"
        fi
