name: "Run E2E tests"
description: "Download a build job's packages and run the E2E suite (without performance benchmarks) against them"
inputs:
  artifact_name:
    description: "Name of the build artifact holding the binaries, e.g. packages-noble"
    required: true
  install_tools:
    description: "Shell command installing the compression tools the E2E suite exercises on this runner"
    required: true
runs:
  using: "composite"
  steps:
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: ${{ inputs.artifact_name }}
        path: build/output

    - name: Install compression tools
      shell: bash
      env:
        INSTALL_TOOLS: ${{ inputs.install_tools }}
      run: bash -euo pipefail -c "$INSTALL_TOOLS"

    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.12'

    # The hash-locked requirements only (#317): the logsquirl-e2e-tests
    # project itself installs no module, pytest finds the suite's modules
    # through conftest.py's directory.
    - name: Install E2E dependencies
      shell: bash
      run: |
        pip install --require-hashes --only-binary :all: -r .github/requirements/e2e.txt

    - name: Run E2E tests (skip performance)
      shell: bash
      working-directory: tests/e2e
      run: pytest -v -m "not performance" --binary-dir=../../build/output
