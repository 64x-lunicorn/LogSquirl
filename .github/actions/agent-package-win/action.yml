name: "Prepare windows packages"
description: ""
inputs:
  s3-key-id:
    required: true
  s3-secret:
    required: true
  s3-bucket:
    required: true
  sign-cert-pfx:
    description: "Base64-encoded PFX code-signing certificate (optional)"
    required: false
    default: ""
  sign-cert-password:
    description: "Password for the PFX certificate (optional)"
    required: false
    default: ""
runs:
  using: "composite"
  steps:
    - name: Win codesign executables
      if: ${{ inputs.sign-cert-pfx != '' && github.ref == 'refs/heads/master' }}
      shell: pwsh
      run: |
        $pfxBytes = [System.Convert]::FromBase64String("${{ inputs.sign-cert-pfx }}")
        $pfxPath  = Join-Path $env:RUNNER_TEMP "codesign.pfx"
        [System.IO.File]::WriteAllBytes($pfxPath, $pfxBytes)
        $bin = "$env:LOGSQUIRL_BUILD_ROOT\output"
        $exes = @(
          "$bin\logsquirl.exe",
          "$bin\logsquirl_portable.exe",
          "$bin\logsquirl_grep.exe"
        )
        foreach ($f in $exes) {
          if (Test-Path $f) {
            & signtool sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /f $pfxPath /p "${{ inputs.sign-cert-password }}" $f
          }
        }
        Remove-Item $pfxPath -Force
    
    - name: Win portable
      shell: cmd
      run: |
        packaging\windows\prepare_release.cmd

    - name: Install NSIS
      shell: cmd
      run: choco install nsis -y --no-progress

    - name: Win installer
      shell: cmd
      run: |
        set "PATH=%PATH%;C:\Program Files (x86)\NSIS"
        makensis -V2 -DVERSION=%LOGSQUIRL_VERSION% -DPLATFORM=%LOGSQUIRL_ARCH% -DQT_MAJOR=%LOGSQUIRL_QT% logsquirl.nsi
    
    - name: Win package
      shell: cmd
      run: |
        md %LOGSQUIRL_BUILD_ROOT%\packages
        xcopy logsquirl-win-%LOGSQUIRL_ARCH%-portable.zip %LOGSQUIRL_BUILD_ROOT%\packages /y
        xcopy logsquirl-win-%LOGSQUIRL_ARCH%-pdb.zip %LOGSQUIRL_BUILD_ROOT%\packages /y
        xcopy logsquirl-win-%LOGSQUIRL_ARCH%-setup.exe %LOGSQUIRL_BUILD_ROOT%\packages /y

    - name: Win codesign installer
      if: ${{ inputs.sign-cert-pfx != '' && github.ref == 'refs/heads/master' }}
      shell: pwsh
      run: |
        $pfxBytes = [System.Convert]::FromBase64String("${{ inputs.sign-cert-pfx }}")
        $pfxPath  = Join-Path $env:RUNNER_TEMP "codesign.pfx"
        [System.IO.File]::WriteAllBytes($pfxPath, $pfxBytes)
        $installer = Get-ChildItem "$env:LOGSQUIRL_BUILD_ROOT\packages\*-setup.exe" | Select-Object -First 1
        if ($installer) {
          & signtool sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /f $pfxPath /p "${{ inputs.sign-cert-password }}" $installer.FullName
        }
        Remove-Item $pfxPath -Force
      