name: "Prepare windows packages"
description: "Package the Windows build, unsigned, as portable zip, PDB zip and NSIS installer"

# The PFX signing steps and the unused S3 inputs are gone: their secrets never
# existed, and CI Build must not reference signing secrets outside the
# `release` environment (#203). Signing belongs in CI Release (#207).
runs:
  using: "composite"
  steps:
    - name: Win portable
      # zizmor cannot analyse cmd scripts; this one expands no expression (#204).
      shell: cmd # zizmor: ignore[misfeature]
      run: |
        packaging\windows\prepare_release.cmd

    # NSIS at a pinned version from its portable zip, verified against a
    # SHA-256 (#199). SourceForge is NSIS's only distribution channel; curl
    # retries absorb its mirror redirects.
    - name: Install NSIS
      shell: bash
      env:
        # Renovate has no SourceForge datasource; custom.nsis in renovate.json5
        # reads the release folders of the NSIS 3 file listing (#211).
        # renovate: datasource=custom.nsis depName=nsis
        NSIS_VERSION: "3.12"
        NSIS_SHA256: 56581f90db321581c5381193d796fffcf2d24b2f8fed2160a6c6a3baa67f2c4f
      # GITHUB_PATH gets a directory under RUNNER_TEMP named after the pinned
      # version, never untrusted input (#204).
      run: | # zizmor: ignore[github-env]
        set -euo pipefail
        zip="$RUNNER_TEMP/nsis-$NSIS_VERSION.zip"
        curl --fail --silent --show-error --location --retry 5 --retry-all-errors \
          --output "$zip" \
          "https://downloads.sourceforge.net/project/nsis/NSIS%203/$NSIS_VERSION/nsis-$NSIS_VERSION.zip"
        actual=$(cmake -E sha256sum "$zip")
        actual=${actual%% *}
        if [ "$actual" != "$NSIS_SHA256" ]; then
          echo "::error::nsis-$NSIS_VERSION.zip SHA-256 mismatch: expected $NSIS_SHA256, got $actual"
          exit 1
        fi
        (cd "$RUNNER_TEMP" && cmake -E tar xf "$zip")
        echo "$RUNNER_TEMP/nsis-$NSIS_VERSION" >> "$GITHUB_PATH"
        "$RUNNER_TEMP/nsis-$NSIS_VERSION/makensis" -VERSION

    # cmd reports only the last command's exit code, so every command that
    # can fail ends in `|| exit /b 1` (#218).
    - name: Win installer
      # zizmor cannot analyse cmd scripts; this one expands no expression (#204).
      shell: cmd # zizmor: ignore[misfeature]
      run: |
        makensis -V2 -DVERSION=%LOGSQUIRL_VERSION% -DPLATFORM=%LOGSQUIRL_ARCH% -DQT_MAJOR=%LOGSQUIRL_QT% logsquirl.nsi || exit /b 1
    
    - name: Win package
      # zizmor cannot analyse cmd scripts; this one expands no expression (#204).
      shell: cmd # zizmor: ignore[misfeature]
      run: |
        md %LOGSQUIRL_BUILD_ROOT%\packages || exit /b 1
        xcopy logsquirl-win-%LOGSQUIRL_ARCH%-portable.zip %LOGSQUIRL_BUILD_ROOT%\packages /y || exit /b 1
        xcopy logsquirl-win-%LOGSQUIRL_ARCH%-pdb.zip %LOGSQUIRL_BUILD_ROOT%\packages /y || exit /b 1
        xcopy logsquirl-win-%LOGSQUIRL_ARCH%-setup.exe %LOGSQUIRL_BUILD_ROOT%\packages /y || exit /b 1
