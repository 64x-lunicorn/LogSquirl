name: "Prepare windows packages"
description: ""
inputs:
  s3-key-id:
    required: true
  s3-secret:
    required: true
  s3-bucket:
    required: true
  sign-cert-pfx:
    description: "Base64-encoded PFX code-signing certificate (optional)"
    required: false
    default: ""
  sign-cert-password:
    description: "Password for the PFX certificate (optional)"
    required: false
    default: ""
runs:
  using: "composite"
  steps:
    - name: Win codesign executables
      if: ${{ inputs.sign-cert-pfx != '' && github.ref == 'refs/heads/master' }}
      shell: pwsh
      # The certificate and its password reach the script through the
      # environment, never interpolated into it (#204).
      env:
        SIGN_CERT_PFX: ${{ inputs.sign-cert-pfx }}
        SIGN_CERT_PASSWORD: ${{ inputs.sign-cert-password }}
      run: |
        # pwsh stops on cmdlet errors only; signtool is a native command, so its
        # exit code is checked, or an unsigned binary would ship (#218).
        $ErrorActionPreference = 'Stop'
        $pfxBytes = [System.Convert]::FromBase64String($env:SIGN_CERT_PFX)
        $pfxPath  = Join-Path $env:RUNNER_TEMP "codesign.pfx"
        [System.IO.File]::WriteAllBytes($pfxPath, $pfxBytes)
        $bin = "$env:LOGSQUIRL_BUILD_ROOT\output"
        $exes = @(
          "$bin\logsquirl.exe",
          "$bin\logsquirl_portable.exe",
          "$bin\logsquirl_grep.exe"
        )
        foreach ($f in $exes) {
          if (Test-Path $f) {
            & signtool sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /f $pfxPath /p "$env:SIGN_CERT_PASSWORD" $f
            if ($LASTEXITCODE -ne 0) { throw "signtool failed for $f with exit code $LASTEXITCODE" }
          }
        }
        Remove-Item $pfxPath -Force
    
    - name: Win portable
      # zizmor cannot analyse cmd scripts; this one expands no expression (#204).
      shell: cmd # zizmor: ignore[misfeature]
      run: |
        packaging\windows\prepare_release.cmd

    # NSIS at a pinned version from its portable zip, verified against a
    # SHA-256 (#199). SourceForge is NSIS's only distribution channel; curl
    # retries absorb its mirror redirects.
    - name: Install NSIS
      shell: bash
      env:
        # renovate: datasource=sourceforge depName=nsis
        NSIS_VERSION: "3.12"
        NSIS_SHA256: 56581f90db321581c5381193d796fffcf2d24b2f8fed2160a6c6a3baa67f2c4f
      # GITHUB_PATH gets a directory under RUNNER_TEMP named after the pinned
      # version, never untrusted input (#204).
      run: | # zizmor: ignore[github-env]
        set -euo pipefail
        zip="$RUNNER_TEMP/nsis-$NSIS_VERSION.zip"
        curl --fail --silent --show-error --location --retry 5 --retry-all-errors \
          --output "$zip" \
          "https://downloads.sourceforge.net/project/nsis/NSIS%203/$NSIS_VERSION/nsis-$NSIS_VERSION.zip"
        actual=$(cmake -E sha256sum "$zip")
        actual=${actual%% *}
        if [ "$actual" != "$NSIS_SHA256" ]; then
          echo "::error::nsis-$NSIS_VERSION.zip SHA-256 mismatch: expected $NSIS_SHA256, got $actual"
          exit 1
        fi
        (cd "$RUNNER_TEMP" && cmake -E tar xf "$zip")
        echo "$RUNNER_TEMP/nsis-$NSIS_VERSION" >> "$GITHUB_PATH"
        "$RUNNER_TEMP/nsis-$NSIS_VERSION/makensis" -VERSION

    # cmd reports only the last command's exit code, so every command that
    # can fail ends in `|| exit /b 1` (#218).
    - name: Win installer
      # zizmor cannot analyse cmd scripts; this one expands no expression (#204).
      shell: cmd # zizmor: ignore[misfeature]
      run: |
        makensis -V2 -DVERSION=%LOGSQUIRL_VERSION% -DPLATFORM=%LOGSQUIRL_ARCH% -DQT_MAJOR=%LOGSQUIRL_QT% logsquirl.nsi || exit /b 1
    
    - name: Win package
      # zizmor cannot analyse cmd scripts; this one expands no expression (#204).
      shell: cmd # zizmor: ignore[misfeature]
      run: |
        md %LOGSQUIRL_BUILD_ROOT%\packages || exit /b 1
        xcopy logsquirl-win-%LOGSQUIRL_ARCH%-portable.zip %LOGSQUIRL_BUILD_ROOT%\packages /y || exit /b 1
        xcopy logsquirl-win-%LOGSQUIRL_ARCH%-pdb.zip %LOGSQUIRL_BUILD_ROOT%\packages /y || exit /b 1
        xcopy logsquirl-win-%LOGSQUIRL_ARCH%-setup.exe %LOGSQUIRL_BUILD_ROOT%\packages /y || exit /b 1

    - name: Win codesign installer
      if: ${{ inputs.sign-cert-pfx != '' && github.ref == 'refs/heads/master' }}
      shell: pwsh
      # The certificate and its password reach the script through the
      # environment, never interpolated into it (#204).
      env:
        SIGN_CERT_PFX: ${{ inputs.sign-cert-pfx }}
        SIGN_CERT_PASSWORD: ${{ inputs.sign-cert-password }}
      run: |
        $ErrorActionPreference = 'Stop'
        $pfxBytes = [System.Convert]::FromBase64String($env:SIGN_CERT_PFX)
        $pfxPath  = Join-Path $env:RUNNER_TEMP "codesign.pfx"
        [System.IO.File]::WriteAllBytes($pfxPath, $pfxBytes)
        $installer = Get-ChildItem "$env:LOGSQUIRL_BUILD_ROOT\packages\*-setup.exe" | Select-Object -First 1
        if ($installer) {
          & signtool sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /f $pfxPath /p "$env:SIGN_CERT_PASSWORD" $installer.FullName
          if ($LASTEXITCODE -ne 0) { throw "signtool failed for $($installer.FullName) with exit code $LASTEXITCODE" }
        }
        Remove-Item $pfxPath -Force
      