name: "Build in container"
description: "Generate the build files and build the code inside the matrix container, with sccache as the compiler launcher"
runs:
  using: "composite"
  steps:
    # The sccache disk cache lives in the workspace (bind-mounted as /usr/local
    # inside the container) and is persisted with the Actions cache. Caches are
    # immutable, so every saving run needs a fresh key and the newest cache of
    # this job wins on restore. Only default-branch runs save (see "Save sccache
    # cache"); pull requests restore master's newest entry, which the Actions
    # cache lets every branch read (#219).
    - name: Restore sccache cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: sccache_cache
        key: sccache-Linux-${{ matrix.config.artifacts_id }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          sccache-Linux-${{ matrix.config.artifacts_id }}-

    # One long-lived container for configure, build and stats: the sccache
    # server is per container, so the stats must be read where the build ran.
    - name: start container
      shell: sh
      run: |
        set -eu
        # Marks the build start for "Trim sccache cache" below.
        touch "$RUNNER_TEMP/sccache-build-start"
        docker run -d --name logsquirl_build \
          --env LOGSQUIRL_VERSION=$LOGSQUIRL_VERSION \
          --env LOGSQUIRL_BUILD_ROOT=$LOGSQUIRL_BUILD_ROOT \
          --env LOGSQUIRL_CMAKE_OPTS="$LOGSQUIRL_CMAKE_OPTS" \
          --env SCCACHE_DIR=/usr/local/sccache_cache \
          --env SCCACHE_CACHE_SIZE=2G \
          -v "$LOGSQUIRL_WORKSPACE":/usr/local "$LOGSQUIRL_CONTAINER" sleep infinity

    - name: configure
      shell: sh
      run: |
        docker exec logsquirl_build /bin/bash -c "cmake -B /usr/local/$LOGSQUIRL_BUILD_ROOT $LOGSQUIRL_CMAKE_OPTS -DCPM_SOURCE_CACHE=/usr/local/cpm_cache -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache /usr/local && sccache --zero-stats"

    - name: build
      shell: sh
      run: |
        docker exec logsquirl_build /bin/bash -c "cmake --build /usr/local/$LOGSQUIRL_BUILD_ROOT --target ci_build"

    - name: sccache stats
      if: always()
      shell: bash
      env:
        BUILD_NAME: Linux / ${{ matrix.config.artifacts_id }}
      run: |
        set -euo pipefail
        docker exec logsquirl_build sccache --show-stats |
          tee "$RUNNER_TEMP/sccache-stats.txt" |
          "$GITHUB_WORKSPACE/.github/scripts/sccache-stats-summary.sh" "$BUILD_NAME"

    # sccache runs as root in the container, so the cache it writes into the
    # bind-mounted workspace is root-owned and unreadable for the runner user;
    # hand it back (to the host's uid:gid) before the cache save reads it. The
    # container is removed even when that fails.
    - name: stop container
      if: always()
      shell: sh
      run: |
        set -eu
        # No container means the start step failed: nothing to clean up. A
        # server that is already gone is fine too; the chown result decides
        # the step, but only after the container is removed.
        docker inspect logsquirl_build > /dev/null 2>&1 || exit 0
        docker exec logsquirl_build sccache --stop-server || true
        status=0
        docker exec logsquirl_build sh -c '[ ! -d "$SCCACHE_DIR" ] || chown -R "$1" "$SCCACHE_DIR"' sh "$(id -u):$(id -g)" || status=$?
        docker rm -f logsquirl_build
        exit $status

    # actions/cache/save only warns when it cannot read the cache and still
    # succeeds, which left every run cold without anyone noticing (#140).
    - name: check sccache cache readable
      id: sccache_readable
      if: always()
      shell: sh
      run: |
        set -eu
        if [ ! -d sccache_cache ]; then
          echo "::error::The build left no sccache cache to save"
          exit 1
        fi
        unreadable=$(find sccache_cache \( ! -readable -o -type d ! -executable \) -print -quit 2>&1) || true
        if [ -n "$unreadable" ]; then
          echo "::error::The sccache cache is not readable by the runner user: $unreadable"
          exit 1
        fi

    # sccache's disk cache sets a file's mtime whenever it stores or hits it,
    # so files not newer than the build start were not used by this build.
    # Without the trim every restore-build-save cycle carried the unused
    # objects forward up to SCCACHE_CACHE_SIZE (2G), and the saved entries
    # grew from ~300 MB to ~450 MB per job between two master builds a day
    # apart. Skipped when the build failed, since the objects of the part it
    # never reached are still needed. The mtime update happens in sccache's
    # (default) server-side mode; the guard skips the trim if a future mode
    # stops touching hit files, rather than throwing the hits away (#219).
    - name: Trim sccache cache
      if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      shell: sh
      run: |
        set -eu
        marker="$RUNNER_TEMP/sccache-build-start"
        hits=$(sed -n 's/^Cache hits  *\([0-9][0-9]*\)$/\1/p' "$RUNNER_TEMP/sccache-stats.txt" 2>/dev/null | head -n 1)
        used=$(find sccache_cache -type f -newer "$marker" | wc -l)
        if [ "$used" -lt "${hits:-0}" ]; then
          echo "::warning::Only $used sccache files are newer than the build start but the build had ${hits} cache hits; not trimming"
          exit 0
        fi
        echo "sccache cache before trim: $(du -sh sccache_cache | cut -f1)"
        find sccache_cache -type f ! -newer "$marker" -delete
        find sccache_cache -mindepth 1 -type d -empty -delete
        echo "sccache cache after trim: $(du -sh sccache_cache | cut -f1)"

    # Each saved entry is 300-450 MB per job, and saving from every run (pull
    # requests included) filled the 10 GB Actions cache within two days so
    # entries were evicted continuously. Only default-branch runs save now; the
    # cleanup workflow (cache-cleanup.yml) deletes the entries they supersede
    # (#219).
    - name: Save sccache cache
      if: >-
        always() && steps.sccache_readable.outcome == 'success'
        && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: sccache_cache
        key: sccache-Linux-${{ matrix.config.artifacts_id }}-${{ github.run_id }}-${{ github.run_attempt }}
