name: "Prepare logsquirl version env var"
description: "Derive LOGSQUIRL_VERSION (YY.MM.PATCH.BUILD) from the project version in CMakeLists.txt and the run number"
runs:
  using: "composite"
  steps:
    # GITHUB_ENV gets one line of digits and dots: the sed pattern admits
    # nothing else from CMakeLists.txt, and no ref name is read (#204).
    - name: Set logsquirl version
      shell: bash
      env:
        RUN_NUMBER: ${{ github.run_number }}
        WORKSPACE: ${{ github.workspace }}
      run: | # zizmor: ignore[github-env]
        set -euo pipefail

        # Build number: derived from the CI run counter, offset to stay above
        # historical build numbers (see BUILD.md → "Version Numbering").
        build_number=$(( RUN_NUMBER + 717 ))

        # Base version is YY.MM.PATCH, always the one declared in CMakeLists.txt,
        # never the ref: a release publishes the packages of the master push run
        # that built the tagged commit, and the tag is pushed after that run, so
        # the commit itself must name the version. CI Release refuses a build
        # whose base version is not the tag's (#221).
        base_version=$(sed -n \
          's/^[[:space:]]*VERSION[[:space:]]\{1,\}\([0-9][0-9.]*\).*/\1/p' \
          "${WORKSPACE}/CMakeLists.txt" | head -n1)

        if [ -z "${base_version}" ]; then
          echo "::error::Unable to determine base version for LOGSQUIRL_VERSION" >&2
          exit 1
        fi

        echo "LOGSQUIRL_VERSION=${base_version}.${build_number}" >> "$GITHUB_ENV"
        echo "Resolved LOGSQUIRL_VERSION=${base_version}.${build_number}"
