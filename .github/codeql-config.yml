# CodeQL analysis configuration.
#
# No paths-ignore here: for compiled languages such as C/C++, CodeQL analyzes
# every file the build compiles and ignores paths-ignore, so the former
# "build/_deps" entry (#63) never excluded anything. Results in third-party
# code (CPM dependencies under build/_deps or cpm_cache) are dropped from the
# SARIF in .github/workflows/codeql-analysis.yml before it is uploaded.

name: "LogSquirl CodeQL config"
