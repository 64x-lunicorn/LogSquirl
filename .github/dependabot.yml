version: 2
# Renovate (renovate.json5, #211) covers what Dependabot cannot read: the CPM
# packages in 3rdparty/CMakeLists.txt, the tool versions pinned in workflows,
# composite actions, Dockerfile ENV lines and scripts, and the hash-locked pip
# requirements (#317). It runs only its custom regex managers and pip-compile,
# so no dependency below is proposed by both.
#
# Every entry has a cooldown: a release is only proposed once it is a week
# old, so a compromised or broken version is usually yanked before it reaches
# a pull request. Security updates ignore the cooldown (#204).
updates:
  # "/" only scans .github/workflows; the composite actions under
  # .github/actions/* pin their own third-party actions.
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    labels:
      - "ci"
      - "dependencies"
    groups:
      github-actions-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # Keeps the digest-pinned FROM lines current (#215); a bump changes the
  # image inputs hash, so CI builds it on the PR and publishes it on merge.
  # The TSan image (#510) starts from the same Ubuntu image; one entry keeps
  # both FROM lines on one digest, in one pull request.
  - package-ecosystem: "docker"
    directories:
      - "/docker/ubuntu24.04"
      - "/docker/ubuntu24.04-tsan"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    labels:
      - "ci"
      - "dependencies"
    groups:
      docker-minor-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "docker"
    directory: "/docker/oracle10"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    labels:
      - "ci"
      - "dependencies"
    groups:
      docker-minor-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "docker"
    directory: "/docker/fedora44"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    # A Fedora release bump is not a digest bump: the directory, the GHCR image
    # name and CI Build's os_version/check_container all name the release, so a
    # Dockerfile-only bump builds on one Fedora and install-checks on another
    # (this is how fedora43 came to say FROM fedora:44). Move releases by hand (#198).
    ignore:
      - dependency-name: "fedora"
        update-types: ["version-update:semver-major"]
    labels:
      - "ci"
      - "dependencies"

  - package-ecosystem: "docker"
    directory: "/docker/ubuntu22.04"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    labels:
      - "ci"
      - "dependencies"
    groups:
      docker-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # No pip entry: every pip requirements file is locked with hashes, and
  # Renovate's pip-compile manager keeps the pins and the hashes current
  # (renovate.json5, #317).

  - package-ecosystem: "npm"
    directory: "/website"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
    groups:
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"
