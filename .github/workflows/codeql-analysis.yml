name: "CodeQL"

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '0 22 * * 4'
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  actions: read
  contents: read
  security-events: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    # A hang would otherwise hold the runner for the 6-hour default (#218).
    timeout-minutes: ${{ matrix.timeout }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # The workflows and composite actions themselves (#204): CodeQL reads
          # .github/workflows and .github/actions directly, so this entry needs
          # neither Qt nor a build.
          - language: actions
            build-mode: none
            timeout: 10
          # Slowest successful run 25 min, median 17 min (#218).
          - language: cpp
            build-mode: manual
            timeout: 50
            config:
              os: linux
              arch: x64
              qt_version: 6.10.3
              qt_arch: linux_gcc_64
              qt_modules: qt5compat

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    # Initializes the CodeQL tools for scanning.
    - name: Initialize CodeQL
      uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}
        config-file: ./.github/codeql-config.yml

    # Everything up to the analysis builds the C++ code; only cpp needs it.
    - uses: ./.github/actions/agent-setup
      if: matrix.language == 'cpp'

    - name: Prepare compiler env
      if: matrix.language == 'cpp'
      run: |
        set -euo pipefail
        echo "CC=gcc-13" >> "$GITHUB_ENV"
        echo "CXX=g++-13" >> "$GITHUB_ENV"

    - name: configure
      if: matrix.language == 'cpp'
      run: |
        set -euo pipefail
        mkdir build
        cd build
        cmake -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DLOGSQUIRL_GENERIC_CPU=ON -DLOGSQUIRL_USE_SENTRY=OFF -DLOGSQUIRL_USE_VECTORSCAN=OFF -DCMAKE_POLICY_VERSION_MINIMUM=3.5 ..

    - name: build
      if: matrix.language == 'cpp'
      run: |
        cmake --build build -t logsquirl

    # CodeQL analyzes every file the build compiles, including the CPM
    # dependencies under build/_deps: for compiled languages paths-ignore has
    # no effect. So the SARIF is written locally, third-party results are
    # dropped, and only the rest is uploaded (#63 never took effect).
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
      with:
        category: /language:${{ matrix.language }}
        # failure-only: the documented mode for post-processing the SARIF
        # before uploading it; a failed analysis still reports to code scanning.
        upload: failure-only
        output: sarif-results

    - name: Drop results in third-party code
      env:
        LANGUAGE: ${{ matrix.language }}
      run: |
        set -euo pipefail
        shopt -s nullglob
        files=(sarif-results/*.sarif)
        if [ "${#files[@]}" -eq 0 ]; then
          echo "::error::CodeQL wrote no SARIF file to sarif-results/"
          exit 1
        fi
        # Paths are relative to the checkout. CPM puts sources under the build
        # tree's _deps, or under cpm_cache when CPM_SOURCE_CACHE is set.
        # shellcheck disable=SC2016 # jq syntax, not shell expansions
        lib='def third_party:
          (.locations[0].physicalLocation.artifactLocation.uri // "")
          | test("^(build/_deps|cpm_cache|3rdparty/dump_syms)/");'
        dropped="" kept=0
        for sarif in "${files[@]}"; do
          dropped+=$(jq -r "$lib"' .runs[].results[] | select(third_party)
            | "| \(.ruleId) | \(.locations[0].physicalLocation.artifactLocation.uri) |"' "$sarif")
          [ -z "$dropped" ] || dropped+=$'\n'
          jq "$lib"' .runs[].results |= map(select(third_party | not))' "$sarif" > "$sarif.filtered"
          mv "$sarif.filtered" "$sarif"
          kept=$((kept + $(jq '[.runs[].results[]] | length' "$sarif")))
        done
        dropped_count=$(grep -c '^| ' <<<"$dropped" || true)
        # Listed in the job summary, so a filter that drops too much is visible.
        {
          echo "### CodeQL ($LANGUAGE)"
          echo "$kept results uploaded, $dropped_count in third-party code dropped."
          if [ "$dropped_count" -gt 0 ]; then
            echo
            echo "| Rule | File |"
            echo "|---|---|"
            printf '%s' "$dropped"
          fi
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Upload CodeQL results
      uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
      with:
        sarif_file: sarif-results
        category: /language:${{ matrix.language }}
