name: "CodeQL"

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '0 22 * * 4'
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  actions: read
  contents: read
  security-events: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        config:
          - os: linux
            arch: x64
            qt_version: 6.10.3
            qt_arch: linux_gcc_64
            qt_modules: qt5compat
            languages: 'cpp'

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    # Initializes the CodeQL tools for scanning.
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.config.languages }}
        config-file: ./.github/codeql-config.yml

    - uses: ./.github/actions/agent-setup

    - name: Prepare compiler env
      run: |
        echo "CC=gcc-13" >> $GITHUB_ENV
        echo "CXX=g++-13" >> $GITHUB_ENV

    - name: configure
      run: |
        mkdir build
        cd build
        cmake -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DLOGSQUIRL_GENERIC_CPU=ON -DLOGSQUIRL_USE_SENTRY=OFF -DLOGSQUIRL_USE_VECTORSCAN=OFF -DCMAKE_POLICY_VERSION_MINIMUM=3.5 ..

    - name: build
      run: |
        cmake --build build -t logsquirl

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
