name: "Docker Images"

on:
  push:
    branches: [master]
    paths:
      - 'docker/**'
  workflow_dispatch:
    inputs:
      propose_refresh:
        description: "Push the image refresh branch and file its issue instead of building"
        type: boolean
        default: false
  schedule:
    # Monthly: propose a rebuild to pick up OS security patches. It only pushes
    # a branch and files an issue; the images CI uses change once that branch
    # is merged through a pull request (#215).
    - cron: '0 4 1 * *'

permissions: {}

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/64x-lunicorn/logsquirl

jobs:
  # Pushes every image under its inputs hash (docker/image-hash.sh), the tag
  # CI Build pulls, plus :latest for humans. A hash tag is never overwritten:
  # an open PR's CI keeps resolving to the very image it started with, and new
  # OS packages arrive only through a new hash (#215).
  #
  # Each image is scanned before it is pushed, pushed with SBOM and provenance
  # attestations, and signed keyless by digest; CI Build refuses a pulled image
  # whose signature does not come from this workflow on master (#216). Only
  # master may push: a hash tag is never overwritten, so an image signed from
  # a dispatched branch would stay unverifiable under that hash for good.
  build-images:
    if: github.ref == 'refs/heads/master' && ((github.event_name == 'push' && !contains(github.event.head_commit.message, '[skip ci]')) || (github.event_name == 'workflow_dispatch' && !inputs.propose_refresh))
    runs-on: ubuntu-24.04
    # Slowest successful run 6 min before the scan and the attested push build
    # were added (#216); those roughly double a cold build, hence the margin
    # (#218). The TSan image builds Qt from source and sets its own (#510).
    timeout-minutes: ${{ matrix.timeout_minutes || 30 }}
    permissions:
      contents: read
      packages: write
      security-events: write # Trivy SARIF upload to code scanning (#216)
      id-token: write # keyless cosign signature via Fulcio (#216)

    strategy:
      fail-fast: false
      matrix:
        include:
          - container_root: docker/oracle10
            image_name: oracle10
          - container_root: docker/ubuntu24.04
            image_name: ubuntu-noble
          - container_root: docker/ubuntu22.04
            image_name: ubuntu-jammy
          - container_root: docker/fedora44
            image_name: fedora44
          # Qt built with ThreadSanitizer for the Sanitizers / tsan job (#510).
          # Qt takes about an hour; the scan build and the push build share it
          # through the builder's cache.
          - container_root: docker/ubuntu24.04-tsan
            image_name: ubuntu-noble-tsan
            timeout_minutes: 150
            tsan: true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image tag
        id: image
        env:
          CONTAINER_ROOT: ${{ matrix.container_root }}
          IMAGE: ${{ env.IMAGE_PREFIX }}-${{ matrix.image_name }}
        run: |
          set -euo pipefail
          hash=$(sh docker/image-hash.sh "$CONTAINER_ROOT")
          echo "sha256=$hash" >> "$GITHUB_OUTPUT"
          if docker buildx imagetools inspect "$IMAGE:$hash" > /dev/null 2>&1; then
            echo "$IMAGE:$hash already exists; leaving it untouched"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # Qt's tools are built with TSan and run while Qt is built; GCC's libtsan
      # cannot lay out its shadow memory with the runner's vm.mmap_rnd_bits=32,
      # and the build's containers share the runner's kernel (#510).
      - name: Lower ASLR entropy for the sanitizer runtime
        if: matrix.tsan && steps.image.outputs.exists != 'true'
        run: sudo sysctl -w vm.mmap_rnd_bits=28

      # The default docker driver cannot store SBOM or provenance attestations;
      # a docker-container builder can, and it keeps the build cache between
      # the scan build and the push build below (#216).
      - name: Set up Buildx
        if: steps.image.outputs.exists != 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Built into the local daemon first so Trivy scans the image before it
      # exists on GHCR. The docker exporter cannot carry attestations, so they
      # are added by the push build, which replays this build from the cache
      # and so pushes the same layers (#216).
      #
      # The context is docker/ so every image can copy docker/shared. The label
      # keeps its historical name; it repeats the inputs hash of the tag.
      - name: Build for scanning
        if: steps.image.outputs.exists != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: docker
          file: ${{ matrix.container_root }}/Dockerfile
          load: true
          push: false
          provenance: false
          sbom: false
          tags: ${{ env.IMAGE_PREFIX }}-${{ matrix.image_name }}:${{ steps.image.outputs.sha256 }}
          labels: |
            dockerfile.sha256=${{ steps.image.outputs.sha256 }}

      # Findings are reported, not enforced: these are build images, never
      # shipped, and an unfixed-upstream distro CVE turning the job red would
      # stop every image update (including the one that picks up the fix). The
      # SARIF goes to code scanning under a per-image category so each image
      # keeps its own alert set. ignore-unfixed drops findings nobody can act
      # on by rebuilding (#216).
      - name: Scan image
        if: steps.image.outputs.exists != 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE_PREFIX }}-${{ matrix.image_name }}:${{ steps.image.outputs.sha256 }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          limit-severities-for-sarif: true
          exit-code: '0'
          format: sarif
          output: trivy-${{ matrix.image_name }}.sarif

      - name: Upload scan to code scanning
        if: steps.image.outputs.exists != 'true'
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: trivy-${{ matrix.image_name }}.sarif
          category: trivy-image-${{ matrix.image_name }}

      # buildx attaches the SBOM and the max-mode provenance to the pushed
      # image index; the step's digest output is that index digest, which is
      # what gets signed and what CI Build verifies and pulls (#216).
      - name: Build and push
        id: push
        if: steps.image.outputs.exists != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: docker
          file: ${{ matrix.container_root }}/Dockerfile
          push: true
          sbom: true
          provenance: mode=max
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.image_name }}:${{ steps.image.outputs.sha256 }}
            ${{ env.IMAGE_PREFIX }}-${{ matrix.image_name }}:latest
          labels: |
            dockerfile.sha256=${{ steps.image.outputs.sha256 }}

      - name: Install cosign
        if: steps.image.outputs.exists != 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Keyless: the Fulcio certificate names this workflow file and ref, which
      # is exactly the identity CI Build pins (docker-pull-or-build). Signing
      # by digest, not tag, so the signature covers the bytes that were pushed.
      # cosign signs rather than actions/attest-build-provenance: buildx already
      # supplies provenance, and the signature is what CI Build checks (#216).
      - name: Sign image
        if: steps.image.outputs.exists != 'true'
        env:
          IMAGE: ${{ env.IMAGE_PREFIX }}-${{ matrix.image_name }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes "$IMAGE@$DIGEST"

  # Bumps docker/shared/refresh-stamp, which is part of every image's inputs
  # hash. Merging the refresh pushes to master under docker/**, so build-images
  # publishes the refreshed images under their new tags and CI moves to them in
  # the same reviewed step (#215).
  #
  # Workflows may not open pull requests in this repository (#201), and a PR
  # opened with GITHUB_TOKEN would not run CI anyway. The job therefore pushes
  # the refresh branch and files an issue linking to it; the maintainer opens
  # the pull request, which runs CI Build like any other (#215).
  propose-refresh:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.propose_refresh)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
    env:
      BRANCH: ci/docker-image-refresh
      BASE: ${{ github.event.repository.default_branch }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Bump the refresh stamp
        id: bump
        run: |
          set -euo pipefail
          stamp=docker/shared/refresh-stamp
          today=$(date -u +%Y-%m-%d)
          { grep '^#' "$stamp"; echo "$today"; } > "$stamp.new"
          mv "$stamp.new" "$stamp"
          if git diff --quiet; then
            echo "The stamp already reads $today; nothing to propose"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "today=$today" >> "$GITHUB_OUTPUT"
          fi

      # The branch is regenerated from the base each time, so an unmerged
      # refresh is updated in place, and one open issue tracks it.
      - name: Push the branch and file the refresh issue
        if: steps.bump.outputs.changed == 'true'
        env:
          TODAY: ${{ steps.bump.outputs.today }}
        run: |
          set -euo pipefail
          gh auth setup-git
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git commit -am "ci: refresh the CI build images ($TODAY)"
          git push --force origin "HEAD:refs/heads/$BRANCH"

          title="The CI build images are due for a refresh"
          open=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq length)
          if [ "$open" != "0" ]; then
            echo "The refresh issue is already open; branch $BRANCH now carries $TODAY"
            exit 0
          fi

          compare="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/$BASE...$BRANCH?expand=1"
          gh issue create --label ci --label dependencies --title "$title" --body "$(cat <<EOF
          Branch \`$BRANCH\` bumps \`docker/shared/refresh-stamp\` to $TODAY, which gives every CI build image a new inputs hash and so a fresh build with current OS packages.

          **Open the pull request:** $compare

          - CI Build on that PR builds the refreshed images locally and tests against them.
          - After merge, the Docker Images workflow pushes the images under their new tags; until then every other PR keeps using the current ones.
          - Close this issue when the PR is merged.
          EOF
          )"
