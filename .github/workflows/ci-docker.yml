name: "Docker Images"

on:
  push:
    branches: [master]
    paths:
      - 'docker/**'
  workflow_dispatch:
  schedule:
    # Monthly rebuild to pick up OS security patches
    - cron: '0 4 1 * *'

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/64x-lunicorn/logsquirl

jobs:
  build-images:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - container_root: docker/oracle10
            image_name: oracle10
          - container_root: docker/ubuntu24.04
            image_name: ubuntu-noble
          - container_root: docker/ubuntu22.04
            image_name: ubuntu-jammy
          - container_root: docker/fedora43
            image_name: fedora43

    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The label keeps its historical name; it covers the image directory
      # and docker/shared (see docker/image-hash.sh).
      - name: Compute image inputs hash
        id: image_hash
        env:
          CONTAINER_ROOT: ${{ matrix.container_root }}
        run: echo "sha256=$(sh docker/image-hash.sh "$CONTAINER_ROOT")" >> "$GITHUB_OUTPUT"

      # The context is docker/ so every image can copy docker/shared.
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: docker
          file: ${{ matrix.container_root }}/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.image_name }}:latest
            ${{ env.IMAGE_PREFIX }}-${{ matrix.image_name }}:${{ github.sha }}
          labels: |
            dockerfile.sha256=${{ steps.image_hash.outputs.sha256 }}
