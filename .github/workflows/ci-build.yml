name: "CI Build"

on:
  push:
    branches: [master]
    paths-ignore:
      - 'website/**'
      - BUILD.md
      - CODE_OF_CONDUCT.md
      - CONTRIBUTING.md
      - README.md
      - latest.json
      - .gitignore
  # Every pull request runs, so the required "CI passed" check always reports;
  # the Changes job skips the builds for a pull request that changes only the
  # files ignored for a push above (#310, #311).
  pull_request:
    branches: [master]
  # No workflow_call: CI Release no longer rebuilds, it publishes the packages
  # of this workflow's push run on master for the tagged commit (#221). So a
  # push run on master is a release candidate: its packages are unsigned (the
  # signing secrets live in the `release` environment, #203) and carry the
  # version declared in CMakeLists.txt.
  workflow_dispatch:

concurrency:
  group: ci-build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GHCR_PREFIX: ghcr.io/64x-lunicorn/logsquirl

jobs:
  # -----------------------------------------------------------------------
  # Changes — what a pull request changes: `build` unless it changes only the
  # files a push ignores (paths-ignore above, keep both lists equal), `website`
  # when it changes the website. A push or dispatch always builds and leaves
  # the website to Deploy Website, so a website problem cannot block the
  # release candidate (#310, #311).
  # -----------------------------------------------------------------------
  Changes:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      build: ${{ steps.changes.outputs.build }}
      website: ${{ steps.changes.outputs.website }}
    steps:
      # The pull request's merge commit and its first parent, the base branch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Classify the changed files
        id: changes
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            printf 'build=true\nwebsite=false\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          build=false
          website=false
          while IFS= read -r file; do
            case "$file" in
              website/*) website=true ;;
              BUILD.md | CODE_OF_CONDUCT.md | CONTRIBUTING.md | README.md | latest.json | .gitignore) ;;
              *) build=true ;;
            esac
          done < <(git diff --name-only HEAD^1 HEAD)
          echo "build=$build website=$website"
          printf 'build=%s\nwebsite=%s\n' "$build" "$website" >> "$GITHUB_OUTPUT"

  SaveVersion:
    needs: [Changes]
    if: "needs.Changes.outputs.build == 'true'"
    runs-on: ubuntu-24.04
    # Every job has a budget: a hang would otherwise hold a runner for the
    # 6-hour default. Budgets are about twice the slowest successful run among
    # the last 100 runs, and never below 5 minutes (#218).
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/logsquirl-version

      - name: Save version
        run: echo $LOGSQUIRL_VERSION > logsquirl_version.txt

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: logsquirl_version
          path: 'logsquirl_version.txt'
          if-no-files-found: error

  # -----------------------------------------------------------------------
  # Format — clang-format dry-run over project-owned C++ sources. No Qt,
  # no build; just checks the tree matches .clang-format (#120), that
  # every action is pinned to a commit SHA (#202) and that the Renovate
  # config and its checksum pairs are sound (#211).
  # -----------------------------------------------------------------------
  Format:
    name: Format
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Depth 2: a pull request's merge commit and its base, for the release
      # preparation check (#314).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      # A tag can be moved to other code, a commit SHA cannot (#202).
      - name: Check action pins
        run: .github/scripts/check-action-pins.sh

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      # Version 23 and the hashes live in .github/requirements/clang-format.txt,
      # which Renovate keeps current (#317).
      - name: Install clang-format
        run: |
          pip install --require-hashes --only-binary :all: -r .github/requirements/clang-format.txt

      - name: Check formatting
        run: |
          set -euo pipefail
          exit_code=0
          while IFS= read -r f; do
            if ! diff -u "$f" <(clang-format "$f") > /tmp/format.diff; then
              echo "::error file=$f::not clang-format clean"
              cat /tmp/format.diff
              exit_code=1
            fi
          done < <(git ls-files -- '*.cpp' '*.h' '*.hpp' | grep -vE '^(3rdparty/|cpm_cache/|website/)')
          exit $exit_code

      # The update feed reaches every installation as soon as it is merged, so
      # a pull request cannot break it (#310).
      - name: Check the update feed
        run: .github/scripts/release-feed.py check

      # A pull request that changes the project version prepares a release:
      # the top CHANGELOG section, the feed's changelog entry and a website
      # release page must name it, or tagging after the merge fails (#314).
      - name: Check a release preparation is complete
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          git show HEAD^1:CMakeLists.txt > "$RUNNER_TEMP/base-CMakeLists.txt"
          .github/scripts/release-prep.py release-preparation --base-cmakelists "$RUNNER_TEMP/base-CMakeLists.txt"

      # Every `# renovate:` version with a SHA-256 below it needs a download
      # URL rule in the script, or a Renovate bump would leave the hash stale
      # with nothing to refresh it; a SHA-256 without the comment would never
      # be bumped at all (#211). Parsing only, no network.
      - name: Check Renovate checksum pairs
        run: python .github/scripts/update-checksums.py --list

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      # An invalid renovate.json5 makes the Renovate app stop and only say so
      # on its Dependency Dashboard issue; fail the pull request instead (#211).
      - name: Validate the Renovate config
        env:
          # renovate: datasource=npm depName=renovate
          RENOVATE_VERSION: 44.94.1
        # Without a file argument it finds renovate.json5 and checks it as a
        # repository config, which is what the app reads; with one it would be
        # checked as a self-hosted global config.
        run: npx --yes --package "renovate@$RENOVATE_VERSION" renovate-config-validator --strict

  # -----------------------------------------------------------------------
  # SBOM — the source part of the release SBOM (#212): every CPM package and
  # the pinned platform components of this commit, i.e. of the binaries this
  # run builds. A release run (ci-release.yml) adds what the built packages
  # bundle and publishes the result. Running it on every PR tests the
  # generator and validates the SBOM against the CycloneDX schema, so a
  # change to 3rdparty/CMakeLists.txt that the generator cannot describe fails
  # here instead of in a release.
  # -----------------------------------------------------------------------
  SBOM:
    name: SBOM
    needs: [Changes]
    if: "needs.Changes.outputs.build == 'true'"
    runs-on: ubuntu-24.04
    # pytest plus two generator runs; no build (#218).
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install SBOM tooling
        run: pip install --require-hashes -r scripts/sbom/requirements.txt

      - name: Test the SBOM generator
        run: python -m pytest scripts/sbom -p no:cacheprovider

      # The Renovate checksum updater (#211), the action allowlist check
      # (#201) and the release build lookup (#221); they share only pytest
      # with the SBOM tooling, which this job already installs.
      - name: Test the CI scripts
        run: python -m pytest .github/scripts -p no:cacheprovider

      - uses: ./.github/actions/logsquirl-version

      - name: Generate and validate the source SBOM
        env:
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          python scripts/sbom/logsquirl_sbom.py generate --repo-root . \
            --version "$LOGSQUIRL_VERSION" --commit "$COMMIT" --repository "$GITHUB_REPOSITORY" \
            --output sbom-base/logsquirl-sbom-base.cdx.json
          python scripts/sbom/logsquirl_sbom.py validate sbom-base/logsquirl-sbom-base.cdx.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-base
          path: sbom-base/logsquirl-sbom-base.cdx.json
          if-no-files-found: error

  # -----------------------------------------------------------------------
  # Linux — the package matrix. Runs alongside Windows and Mac: every
  # platform starts as soon as Changes has classified the run (#121, #349).
  # -----------------------------------------------------------------------
  Linux:
    name: Linux / ${{ matrix.config.artifacts_id }}
    needs: [Changes]
    if: "needs.Changes.outputs.build == 'true'"
    strategy:
      fail-fast: false
      matrix:
        # check_container is the clean distribution image a package is
        # install-checked in: digest-pinned like the build images' FROM lines,
        # its digest kept current by Renovate. The release in its tag moves by
        # hand with os_version and container_root (#198, #230).
        config:
          - os: oraclelinux
            os_version: 10
            arch: x64
            cpack_gen: RPM
            artifacts_id: oracle
            package_suffix: rpm
            check_container: oraclelinux:10@sha256:1628d6e6586862766a2d5925f0fab6c6e1a468bc33874ae68046c7ca57406baf
            container_root: docker/oracle10
            image: ghcr.io/64x-lunicorn/logsquirl-oracle10
            cmake_opts: -DCMAKE_BUILD_WITH_INSTALL_RPATH=on

          - os: ubuntu_noble
            os_version: 24.04
            arch: x64
            cpack_gen: DEB
            artifacts_id: noble
            package_suffix: deb
            check_container: ubuntu:24.04@sha256:69cecf4bbf72d2d44a9eef1b71fb98c7fb973d78af11399deccef19beb008ad9
            container_root: docker/ubuntu24.04
            image: ghcr.io/64x-lunicorn/logsquirl-ubuntu-noble
            cmake_opts:

          - os: ubuntu_appimage
            # Built on Ubuntu 22.04 (jammy) so the AppImage's glibc/libstdc++
            # floor stays at 2.35 / GCC 12 — runs on jammy and every newer distro.
            os_version: 22.04
            arch: x64
            artifacts_id: appimage
            package_suffix: AppImage
            container_root: docker/ubuntu22.04
            image: ghcr.io/64x-lunicorn/logsquirl-ubuntu-jammy
            cmake_opts:

          - os: fedora
            os_version: 44
            arch: x64
            cpack_gen: RPM
            artifacts_id: fedora
            package_suffix: rpm
            check_container: fedora:44@sha256:43b29f65a41eb9c35e1cd5323e3bdf3b655c2357a9f4f1ff2f9c2798e5045d80
            container_root: docker/fedora44
            image: ghcr.io/64x-lunicorn/logsquirl-fedora44
            cmake_opts:

    runs-on: ubuntu-24.04
    # Slowest successful run 28 min (appimage; noble/oracle/fedora 22-24 min),
    # with the image built locally and a cold sccache adding more, and one
    # process per test case since #217 making the test step ~40% longer (#218).
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # matrix.config.image carries no tag: the action tags it with the image
      # inputs hash and exports the ref as LOGSQUIRL_CONTAINER for every later
      # step, so the run is unaffected by what the Docker Images workflow pushes
      # meanwhile (#215). A pulled image must carry the Docker Images workflow's
      # cosign signature or the job fails; the action installs cosign (#216).
      - uses: ./.github/actions/docker-pull-or-build
        with:
          image: ${{ matrix.config.image }}
          container_root: ${{ matrix.config.container_root }}

      # The key covers the CPM script as well as the package list (#219).
      - name: Restore CPM cache
        id: cpm_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: cpm_cache
          key: cpm-Linux-${{ matrix.config.artifacts_id }}-${{ hashFiles('3rdparty/CMakeLists.txt', 'cmake/CPM.cmake') }}
          restore-keys: |
            cpm-Linux-${{ matrix.config.artifacts_id }}-

      - uses: ./.github/actions/logsquirl-version
      - uses: ./.github/actions/prepare-workspace-env
      - uses: ./.github/actions/docker-build

      # Only the default branch saves, and only when the exact key was missing
      # (caches are immutable): a dependency change on a pull request would
      # otherwise add a ~400 MB entry per job scoped to that pull request (#219).
      - name: Save CPM cache
        if: >-
          steps.cpm_cache.outputs.cache-hit != 'true'
          && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: cpm_cache
          key: ${{ steps.cpm_cache.outputs.cache-primary-key }}

      - uses: ./.github/actions/docker-run-tests

      # One Linux configuration runs the E2E suite; the others build the same
      # sources for their distribution's packages (#366).
      - uses: ./.github/actions/docker-run-e2e
        if: ${{ matrix.config.artifacts_id == 'noble' }}

      - uses: ./.github/actions/docker-package

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packages-${{ matrix.config.artifacts_id }}
          path: '${{ env.LOGSQUIRL_BUILD_ROOT }}/packages/*'
          if-no-files-found: error

  # -----------------------------------------------------------------------
  # Sanitizers — ASan + UBSan build of the test suites in the Noble
  # container. Runs alongside the Linux matrix; no packaging, only the test report.
  # -----------------------------------------------------------------------
  Sanitizers:
    name: Sanitizers / asan-ubsan
    needs: [Changes]
    if: "needs.Changes.outputs.build == 'true'"
    strategy:
      matrix:
        config:
          # Single-entry matrix so the shared composite actions (which read
          # matrix.config.*) work unchanged.
          - arch: x64
            artifacts_id: asan
            container_root: docker/ubuntu24.04
            image: ghcr.io/64x-lunicorn/logsquirl-ubuntu-noble
            # Sentry/crashpad is a release concern and its own crash handler
            # would fight the sanitizer runtime; LTO only slows the link of a
            # build nobody ships. Vectorscan stays ON: it builds and runs clean
            # under ASan (it is a CPM dependency, so it is not instrumented).
            cmake_opts: >-
              -DENABLE_SANITIZER_ADDRESS=ON
              -DENABLE_SANITIZER_UNDEFINED_BEHAVIOR=ON
              -DLOGSQUIRL_USE_SENTRY=OFF
              -DLOGSQUIRL_USE_LTO=OFF

    runs-on: ubuntu-24.04
    # Slowest successful run 25 min, before #217 started one process per test
    # case (~40% longer tests, more under ASan) (#218).
    timeout-minutes: 75
    env:
      # halt_on_error: the first report aborts the test binary, so ctest goes red.
      # detect_leaks=0: Qt's offscreen platform plugin and its global statics
      # leak by design at exit; LSan would drown real findings in that noise.
      ASAN_OPTIONS: halt_on_error=1:print_stacktrace=1:detect_leaks=0:symbolize=1:abort_on_error=0
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1:symbolize=1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: ./.github/actions/docker-pull-or-build
        with:
          image: ${{ matrix.config.image }}
          container_root: ${{ matrix.config.container_root }}

      # Same container and package list as the noble job, minus Sentry, so the
      # noble job's CPM cache already holds everything this build downloads;
      # restoring it instead of saving a ~290 MB copy of our own keeps the
      # Actions cache under its limit (#219).
      - name: Restore CPM cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: cpm_cache
          key: cpm-Linux-noble-${{ hashFiles('3rdparty/CMakeLists.txt', 'cmake/CPM.cmake') }}
          restore-keys: |
            cpm-Linux-noble-

      - name: Lower ASLR entropy for ASan
        # Kernels with vm.mmap_rnd_bits=32 (GitHub's Ubuntu runners) break the
        # shadow-memory layout of GCC's libasan; containers share the host
        # kernel, so this must be set on the runner.
        run: sudo sysctl -w vm.mmap_rnd_bits=28

      - uses: ./.github/actions/logsquirl-version
      - uses: ./.github/actions/prepare-workspace-env
      - uses: ./.github/actions/docker-build

      # Per test case, with a JUnit report kept even when a case fails (#217).
      - name: Run tests under ASan/UBSan
        id: tests
        run: |
          docker run --env LOGSQUIRL_BUILD_ROOT="$LOGSQUIRL_BUILD_ROOT" \
            --env ASAN_OPTIONS="$ASAN_OPTIONS" --env UBSAN_OPTIONS="$UBSAN_OPTIONS" \
            -v "$LOGSQUIRL_WORKSPACE":/usr/local "$LOGSQUIRL_CONTAINER" \
            /bin/bash -c "cd /usr/local/$LOGSQUIRL_BUILD_ROOT && ctest --output-on-failure --timeout 120 --output-junit ctest-junit.xml"

      - uses: ./.github/actions/ctest-report
        if: always() && steps.tests.outcome != 'skipped'
        with:
          junit-file: ${{ env.LOGSQUIRL_BUILD_ROOT }}/ctest-junit.xml
          artifact-name: ${{ matrix.config.artifacts_id }}

  # -----------------------------------------------------------------------
  # macOS — runs alongside Linux and Windows (#121, #349). Linux gated this
  # job to keep a compile error off the dearer runners; the repository is
  # public, so those runners are free and carry no cost multiplier, and the
  # gate only cost the wall clock of a whole Linux matrix. The build gate is
  # this job's own: it used to be inherited from a skipped Linux, and without
  # it a website-only pull request would now build here (#310, #311).
  # -----------------------------------------------------------------------
  Mac:
    name: Mac
    needs: [Changes]
    if: "needs.Changes.outputs.build == 'true'"
    strategy:
      fail-fast: false
      matrix:
        config:
          - os: macos
            runner: macos-26
            qt_version: 6.11.2
            qt_arch: clang_64
            qt_modules: qt5compat
            arch: arm64
            artifacts_id: mac-arm64
            # No -DCMAKE_BUILD_TYPE override: RelWithDebInfo is the default
            # (StandardProjectSettings.cmake), so the release dSYM carries
            # line info at the same optimization as before (#340), matching
            # Windows and Linux (#280).
            cmake_opts: -DLOGSQUIRL_OSX_DEPLOYMENT_TARGET=15.0 -DCMAKE_SKIP_INSTALL_RPATH=ON

    runs-on: ${{ matrix.config.runner }}
    # Slowest successful run 25 min, when master builds still waited on
    # notarization, which moved to CI Release (#203, #218).
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set brew env
        run: |
          set -euo pipefail
          echo "HOMEBREW_NO_ANALYTICS=1" >> $GITHUB_ENV
          echo "HOMEBREW_NO_AUTO_UPDATE=1" >> $GITHUB_ENV
          echo "HOMEBREW_NO_INSTALL_CLEANUP=1" >> $GITHUB_ENV

      # Ragel stays on Homebrew (#199): it only generates Vectorscan sources at
      # build time and never ships, brew verifies the bottle's SHA-256, and
      # HOMEBREW_NO_AUTO_UPDATE freezes the formula to the runner image. A
      # formula bump is surfaced as a warning rather than failing the build.
      - name: Brew deps
        env:
          RAGEL_EXPECTED_VERSION: "6.11"
        run: |
          brew install ragel
          ragel_version=$(ragel --version | head -n 1)
          echo "$ragel_version"
          case "$ragel_version" in
            *"version $RAGEL_EXPECTED_VERSION "*) ;;
            *) echo "::warning::ragel is not $RAGEL_EXPECTED_VERSION: $ragel_version" ;;
          esac

      - uses: ./.github/actions/agent-setup
      - uses: ./.github/actions/logsquirl-version
      - uses: ./.github/actions/prepare-workspace-env
      - uses: ./.github/actions/agent-build
      - uses: ./.github/actions/agent-run-tests
      - uses: ./.github/actions/run-e2e
        with:
          install_tools: brew install zstd lz4
      # Unsigned on every event and branch: the signing secrets live in the
      # `release` environment, and CI Release signs these packages (#203).
      - uses: ./.github/actions/agent-package-mac

      # The release build is RelWithDebInfo with LTO (#340), so this checks
      # what #280 already gets for free on Windows and Linux: the dSYM's
      # debug line program actually names a LogSquirl source file, meaning
      # dsymutil found the LTO object's line table rather than only the
      # symbol table (which would resolve a crash to a function, not a
      # file and line).
      - name: Verify the dSYM carries line info
        shell: sh
        run: |
          set -eu
          cd "$LOGSQUIRL_BUILD_ROOT"
          # logsquirl.dSym is a bundle (a directory), not a file: dwarfdump
          # wants the DWARF file inside it, not the bundle path itself.
          dwarf_file="./output/logsquirl.dSym/Contents/Resources/DWARF/logsquirl"
          lines=$(dwarfdump --debug-line "$dwarf_file" | grep -c '\.cpp"$' || true)
          echo "source files in the debug line program: $lines"
          if [ "$lines" -eq 0 ]; then
            echo "::error::dSYM has no debug line info (dsymutil likely lost the LTO object, #340)"
            exit 1
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packages-${{ matrix.config.artifacts_id }}
          path: '${{ env.LOGSQUIRL_BUILD_ROOT }}/packages/*'
          if-no-files-found: error

  # -----------------------------------------------------------------------
  # Windows — runs alongside Linux and Mac (#121, #349), and carries its own
  # build gate for the same reason macOS does.
  # -----------------------------------------------------------------------
  Windows:
    name: Windows
    needs: [Changes]
    if: "needs.Changes.outputs.build == 'true'"
    strategy:
      fail-fast: false
      matrix:
        config:
          - os: windows
            runner: windows-2025
            qt_version: 6.11.2
            qt_modules: qt5compat
            qt_arch: win64_msvc2022_64
            arch: x64
            ssl_arch: -x64
            cmake_opts:
            artifacts_id: windows-x64

    runs-on: ${{ matrix.config.runner }}
    # Slowest successful run 38 min (cold sccache), median 22 min, before #217's
    # per-case test processes; #199's changed cache keys start it cold (#218).
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The OpenSSL the Windows package ships: pinned version and SHA-256,
      # cached per version (#199).
      - uses: ./.github/actions/windows-openssl

      - name: Set openssl paths
        shell: sh
        run: |
          set -eu
          echo "SSL_DIR=${{ github.workspace }}\openssl-3\${{ matrix.config.arch }}\bin" >> $GITHUB_ENV
          echo "SSL_ARCH=${{ matrix.config.ssl_arch }}" >> $GITHUB_ENV

      - uses: ./.github/actions/agent-setup
      - uses: ./.github/actions/logsquirl-version
      - uses: ./.github/actions/prepare-workspace-env

      - name: Prepare dev cmd
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: ${{ matrix.config.arch }}

      - uses: ./.github/actions/agent-build
      - uses: ./.github/actions/agent-run-tests
      - uses: ./.github/actions/run-e2e
        with:
          # lz4 has no Chocolatey package; the suite skips that format.
          install_tools: choco install zstandard --no-progress -y
      # Unsigned, like the macOS packages: CI Build references no signing
      # secret, so none can reach a job outside the `release` environment (#203).
      - uses: ./.github/actions/agent-package-win

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packages-${{ matrix.config.artifacts_id }}
          path: '${{ env.LOGSQUIRL_BUILD_ROOT }}/packages/*'
          if-no-files-found: error

  # -----------------------------------------------------------------------
  # Website — the build the deploy runs, including its link check, for a pull
  # request that changes the website; no secrets (#311).
  # -----------------------------------------------------------------------
  Website:
    needs: [Changes]
    if: "needs.Changes.outputs.website == 'true'"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: cd website && npm ci

      - name: Test the release pages
        run: cd website && npm test

      - name: Build and check links
        run: cd website && npm run build

      # The deploy leaves out the pages of unpublished releases (#315); a link
      # to one of them would fail the deploy after the merge, so build that
      # variant here too. Public release listing, no secrets.
      - name: Build and check links as deployed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq '.[] | select(.draft | not) | .tag_name' > "$RUNNER_TEMP/published-releases.txt"
          cd website
          node scripts/leave-out-unpublished.mjs "$RUNNER_TEMP/published-releases.txt"
          npm run build

  # ---------------------------------------------------------------------------
  # Aggregate gate — the single required status check on master (#115).
  # Runs even when a dependency failed or was cancelled, so it can turn that
  # into its own failure; skipped only when the whole run is a [skip ci] run.
  # ---------------------------------------------------------------------------
  ci-passed:
    name: CI passed
    needs:
      [Changes, SaveVersion, Format, SBOM, Linux, Sanitizers, Windows, Mac, Website]
    if: ${{ always() && !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # A job may be skipped only when Changes found nothing for it to check:
      # the build jobs for a pull request without code changes, Website for
      # one without website changes (#310, #311).
      - name: Require every needed job to have succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if echo "$NEEDS" | jq -e '
              (.Changes.outputs.build == "true") as $build
              | (.Changes.outputs.website == "true") as $website
              | to_entries | all(
                  .value.result == "success"
                  or (.value.result == "skipped" and (
                        (.key == "Website" and ($website | not))
                        or (.key != "Changes" and .key != "Format" and .key != "Website" and ($build | not)))))' > /dev/null; then
            echo "All jobs succeeded."
          else
            echo "::error::At least one job did not succeed."
            exit 1
          fi
