name: "CI Build"

on:
  push:
    branches: [master]
    paths-ignore:
      - 'website/**'
      - BUILD.md
      - CODE_OF_CONDUCT.md
      - CONTRIBUTING.md
      - README.md
      - latest.json
      - .gitignore
  pull_request:
    branches: [master]
    paths-ignore:
      - 'website/**'
      - BUILD.md
      - CODE_OF_CONDUCT.md
      - CONTRIBUTING.md
      - README.md
      - latest.json
      - .gitignore
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ci-build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GHCR_PREFIX: ghcr.io/64x-lunicorn/logsquirl

jobs:
  SaveVersion:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/logsquirl-version

      - name: Save version
        run: echo $LOGSQUIRL_VERSION > logsquirl_version.txt

      - uses: actions/upload-artifact@v7
        with:
          name: logsquirl_version
          path: 'logsquirl_version.txt'
          if-no-files-found: error

  # -----------------------------------------------------------------------
  # Stage 1 — Linux (cheapest runners, gates Windows & Mac)
  # -----------------------------------------------------------------------
  Linux:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    strategy:
      fail-fast: false
      matrix:
        config:
          - os: oraclelinux
            os_version: 10
            arch: x64
            check_command: dnf install -y --setopt tsflags=test /usr/local/logsquirl*.rpm
            cpack_gen: RPM
            artifacts_id: oracle
            package_suffix: rpm
            check_container: oraclelinux:10
            container_root: docker/oracle10
            container: ghcr.io/64x-lunicorn/logsquirl-oracle10:latest
            cmake_opts: -DCMAKE_BUILD_WITH_INSTALL_RPATH=on

          - os: ubuntu_noble
            os_version: 24.04
            arch: x64
            check_command: apt-get update && apt install --dry-run /usr/local/logsquirl*.deb
            cpack_gen: DEB
            artifacts_id: noble
            package_suffix: deb
            check_container: ubuntu:24.04
            container_root: docker/ubuntu24.04
            container: ghcr.io/64x-lunicorn/logsquirl-ubuntu-noble:latest
            cmake_opts:

          - os: ubuntu_appimage
            os_version: 24.04
            arch: x64
            artifacts_id: appimage
            package_suffix: AppImage
            container_root: docker/ubuntu24.04
            container: ghcr.io/64x-lunicorn/logsquirl-ubuntu-noble:latest
            cmake_opts:

          - os: fedora
            os_version: 43
            arch: x64
            check_command: dnf install -y --setopt tsflags=test /usr/local/logsquirl*.rpm
            cpack_gen: RPM
            artifacts_id: fedora
            package_suffix: rpm
            check_container: fedora:43
            container_root: docker/fedora43
            container: ghcr.io/64x-lunicorn/logsquirl-fedora43:latest
            cmake_opts:

    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull or build container
        run: |
          LOCAL_HASH=$(sha256sum ${{ matrix.config.container_root }}/Dockerfile | cut -d' ' -f1)
          NEED_BUILD=false

          if docker pull ${{ matrix.config.container }} 2>/dev/null; then
            REMOTE_HASH=$(docker inspect --format='{{index .Config.Labels "dockerfile.sha256"}}' ${{ matrix.config.container }} 2>/dev/null || echo "")
            if [ "$LOCAL_HASH" != "$REMOTE_HASH" ]; then
              echo "::warning::Dockerfile changed (local=$LOCAL_HASH remote=$REMOTE_HASH), rebuilding"
              NEED_BUILD=true
            fi
          else
            echo "::warning::GHCR image not found, building locally"
            NEED_BUILD=true
          fi

          if [ "$NEED_BUILD" = "true" ]; then
            docker build --label "dockerfile.sha256=$LOCAL_HASH" \
              -t ${{ matrix.config.container }} ${{ matrix.config.container_root }}
          fi

      - name: Restore CPM cache
        uses: actions/cache@v5
        with:
          path: cpm_cache
          key: cpm-Linux-${{ matrix.config.artifacts_id }}-${{ hashFiles('3rdparty/CMakeLists.txt') }}
          restore-keys: |
            cpm-Linux-${{ matrix.config.artifacts_id }}-

      - uses: ./.github/actions/logsquirl-version
      - uses: ./.github/actions/prepare-workspace-env
      - uses: ./.github/actions/docker-build
      - uses: ./.github/actions/docker-run-tests
      - uses: ./.github/actions/docker-package

      - uses: actions/upload-artifact@v7
        with:
          name: packages-${{ matrix.config.artifacts_id }}
          path: '${{ env.LOGSQUIRL_BUILD_ROOT }}/packages/*'
          if-no-files-found: error

  # -----------------------------------------------------------------------
  # Stage 3 — macOS (most expensive, runs only after Windows succeeds)
  # -----------------------------------------------------------------------
  Mac:
    needs: [Windows]
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    strategy:
      fail-fast: false
      matrix:
        config:
          - os: macos
            runner: macos-26
            qt_version: 6.10.3
            qt_arch: clang_64
            qt_modules: qt5compat
            arch: arm64
            artifacts_id: mac-arm64
            cmake_opts: -DLOGSQUIRL_OSX_DEPLOYMENT_TARGET=15.0 -DCMAKE_SKIP_INSTALL_RPATH=ON -DCMAKE_BUILD_TYPE=Release

    runs-on: ${{ matrix.config.runner }}
    steps:
      - uses: actions/checkout@v6

      - name: Set brew env
        run: |
          echo "HOMEBREW_NO_ANALYTICS=1" >> $GITHUB_ENV
          echo "HOMEBREW_NO_AUTO_UPDATE=1" >> $GITHUB_ENV
          echo "HOMEBREW_NO_INSTALL_CLEANUP=1" >> $GITHUB_ENV

      - name: Brew deps
        run: |
          brew install ragel

      - uses: ./.github/actions/agent-setup
      - uses: ./.github/actions/logsquirl-version
      - uses: ./.github/actions/prepare-workspace-env
      - uses: ./.github/actions/agent-build
      - uses: ./.github/actions/agent-run-tests
      - uses: ./.github/actions/agent-package-mac
        with:
          p12-file-base64: ${{ secrets.MACOS_P12_FILE }}
          p12-password: ${{ secrets.MACOS_P12_PASSWORD }}
          notarization-username: ${{ secrets.APPLE_ID }}
          notarization-team: ${{ secrets.APPLE_TEAM_ID }}
          notarization-password: ${{ secrets.APPLE_PASSWORD }}

      - uses: actions/upload-artifact@v7
        with:
          name: packages-${{ matrix.config.artifacts_id }}
          path: '${{ env.LOGSQUIRL_BUILD_ROOT }}/packages/*'
          if-no-files-found: error

  # -----------------------------------------------------------------------
  # Stage 2 — Windows (2× cost, runs only after Linux succeeds)
  # -----------------------------------------------------------------------
  Windows:
    needs: [Linux]
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    strategy:
      fail-fast: false
      matrix:
        config:
          - os: windows
            runner: windows-2025
            qt_version: 6.10.3
            qt_modules: qt5compat
            qt_arch: win64_msvc2022_64
            arch: x64
            ssl_arch: -x64
            cmake_opts:
            artifacts_id: windows-x64

    runs-on: ${{ matrix.config.runner }}
    steps:
      - uses: actions/checkout@v6

      - name: Cache openssl
        id: cache-openssl
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}\openssl-3
          key: OpensslCache-3-choco-x64

      - name: Install openssl
        if: ${{ steps.cache-openssl.outputs.cache-hit != 'true' }}
        run: |
          choco install openssl --no-progress -y
          $sslDir = (Get-ChildItem 'C:\Program Files\OpenSSL*' -Directory -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
          if (-not $sslDir) { $sslDir = (Get-ChildItem 'C:\' -Directory -Filter 'OpenSSL*' -Recurse -Depth 1 -ErrorAction SilentlyContinue | Where-Object { Test-Path "$($_.FullName)\bin" } | Select-Object -First 1).FullName }
          Write-Host "Found OpenSSL at: $sslDir"
          New-Item -ItemType Directory -Force -Path "${{ github.workspace }}\openssl-3\x64\bin"
          Copy-Item "$sslDir\bin\*.dll" "${{ github.workspace }}\openssl-3\x64\bin\"

      - name: Set openssl paths
        shell: sh
        run: |
          echo "SSL_DIR=${{ github.workspace }}\openssl-3\${{ matrix.config.arch }}\bin" >> $GITHUB_ENV
          echo "SSL_ARCH=${{ matrix.config.ssl_arch }}" >> $GITHUB_ENV

      - uses: ./.github/actions/agent-setup
      - uses: ./.github/actions/logsquirl-version
      - uses: ./.github/actions/prepare-workspace-env

      - name: Prepare dev cmd
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.config.arch }}

      - uses: ./.github/actions/agent-build
      - uses: ./.github/actions/agent-run-tests
      - uses: ./.github/actions/agent-package-win
        with:
          s3-key-id: ${{ secrets.WIN_CS_KEY_ID }}
          s3-secret: ${{ secrets.WIN_CS_SECRET }}
          s3-bucket: ${{ secrets.WIN_CS_BUCKET }}
          sign-cert-pfx: ${{ secrets.WIN_SIGN_CERT_PFX }}
          sign-cert-password: ${{ secrets.WIN_SIGN_CERT_PASSWORD }}

      - uses: actions/upload-artifact@v7
        with:
          name: packages-${{ matrix.config.artifacts_id }}
          path: '${{ env.LOGSQUIRL_BUILD_ROOT }}/packages/*'
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # E2E tests — run after build artifacts are available
  # ---------------------------------------------------------------------------
  e2e-tests:
    name: "E2E Tests (${{ matrix.os }})"
    needs: [Linux, Mac, Windows]
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact: packages-noble
          - os: macos-15
            artifact: packages-mac-arm64
          - os: windows-2025
            artifact: packages-windows-x64
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: build/output

      - name: Install compression tools
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq zstd lz4
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            brew install zstd lz4
          elif [[ "$RUNNER_OS" == "Windows" ]]; then
            choco install zstandard --no-progress -y
            # lz4 has no Chocolatey package; tests skip gracefully
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install E2E dependencies
        working-directory: tests/e2e
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run E2E tests (skip performance)
        working-directory: tests/e2e
        run: pytest -v -m "not performance" --binary-dir=../../build/output
