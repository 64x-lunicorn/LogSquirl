name: "Performance"

# Measures master every night, keeps every result and files an issue when a
# benchmark regressed or a Budget broke (#441, #677, #685).
#
# Two jobs measure the same commit on GitHub-hosted runners, side by side:
#
# - measure: an optimized build (RelWithDebInfo with LTO, the options and
#   container of the CI Build noble job) runs the whole e2e performance suite,
#   the benchmark mode's scenarios on the 10, 50 and 100 MB files and the
#   generated 100 MB and 1 GB Log Files (#667): wall-clock, 21 runs each.
#   On the same runner it then runs the same suite on a reference build, the
#   last release tag built in this commit's container (cached per release),
#   so each benchmark has a ratio this commit / release that does not depend
#   on the CPU model the runner has (#685; .github/scripts/perf-run-suite.sh).
# - count: every Catch2 benchmark of tests/benchmarks runs once under
#   Callgrind and is counted, as on a pull request (#671; the same scripts,
#   instruction-counts-side.sh and instruction-counts.py), but with generated
#   Log Files of `count_log_file_mb` instead of 4 MiB. Counts repeat to within
#   a fraction of a percent on a shared runner; times vary by 5-20 % and more
#   between the runners' CPU models.
#
# The record job finds the change points of each benchmark's series
# (.github/scripts/perf-history.py and perf_changepoint.py; BUILD.md, "Nightly
# performance", states the rule), checks each Budget of ADR 0018
# (tests/e2e/budgets.json) and commits the run to the perf-data branch
# (history/ and trend.csv, with the ratios). Wall-clock medians compare only
# with earlier runs on the same runner CPU model, and a run whose median
# within-run CV is above 20 % is recorded but not compared (#685). A change
# point in the instruction counts, a broken Budget or a benchmark that went
# missing is a finding (a Budget only once budgets.json's status is accepted,
# ADR 0018); wall-clock change points are the trend and file nothing:
# instruction counts are the gate.
#
# For the findings of a run of the default branch, the issues job opens an
# issue per scenario, labelled needs-triage and performance, that names the
# commit range from the last good run to the first bad one, or updates the one
# that is open (perf-issues.py decides and writes the texts; the job only
# calls gh). The run is red as well while a finding stands.
#
# A dispatch from any other branch is compared with master's history the same
# way but lands in trial/, which nothing compares with, so a branch can never
# move master's series, and files no issue: its findings are in the job
# summary and the run is red. That is how to check the detection with a test
# commit (BUILD.md, "Nightly performance").
#
# The Benchmarks workflow (benchmarks.yml) is the other tool: it compares a
# branch with its merge base on one runner, on demand, and the Instruction
# Counts gate (#672) judges every pull request. This one watches master over
# time.
#
# The builds and the measurement run with a read-only token. Only the record
# job, which runs no code of the build and reads the results as JSON, may
# push, and only to the data branch; only the issues job, which runs master's
# scripts on the record job's findings, may write issues, and nothing else.
on:
  schedule:
    # Every night, 02:41 UTC.
    - cron: '41 2 * * *'
  workflow_dispatch:
    inputs:
      e2e_runs:
        description: "Measured runs per e2e performance benchmark (--bench-runs)"
        type: number
        default: 21
      count_log_file_mb:
        description: "MiB of each generated Log File the counted benchmarks write (a pull request counts 4)"
        type: number
        default: 32
      accept_new_level:
        description: "Default branch only: record this run as the new reference after an intentional slowdown; series restart from it"
        type: boolean
        default: false

# One run per ref at a time; the record job additionally serializes all
# pushes to the data branch.
concurrency:
  group: performance-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  DATA_BRANCH: perf-data

jobs:
  measure:
    name: Performance / measure
    # Single-entry matrix so the shared composite actions (which read
    # matrix.config.*) work unchanged. artifacts_id is the noble job's, so
    # docker-build restores that job's sccache cache.
    strategy:
      matrix:
        config:
          - arch: x64
            artifacts_id: noble
            container_root: docker/ubuntu24.04
            image: ghcr.io/64x-lunicorn/logsquirl-ubuntu-noble
            cmake_opts:

    runs-on: ubuntu-24.04
    # A build of about 20 minutes with a warm sccache, longer cold; the
    # reference build when it is not cached (once per release, about as long
    # again); and the performance suite twice, about a quarter of an hour each
    # with its 1 GB cases.
    timeout-minutes: 180
    permissions:
      contents: read
      packages: read # pull the signed build container from GHCR
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      RESULT_DIR: perf-result
      # Everything else this job adds to the workspace: the binaries of both
      # sides and the composite actions for the reference build. Untracked, so
      # switching the checkout to the reference and back keeps it.
      RUN_DIR: perf-run
      QT_QPA_PLATFORM: offscreen
    steps:
      # The whole history without file contents, for the release tags.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none

      # The reference (#685) is the last release tag (vX.Y.Z, no pre-release)
      # in this commit's history, so it never brings in code from outside it.
      # Its ratio is the trend across the runners' CPU models; a new release
      # becomes the next reference, recorded with each run.
      - name: Find the reference release
        id: reference
        run: |
          set -euo pipefail
          tag=$(git tag --merged HEAD --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)
          if [ -z "$tag" ]; then
            echo "::warning::No release tag in this commit's history; no reference build, no ratios"
            exit 0
          fi
          commit=$(git rev-parse --verify "refs/tags/$tag^{commit}")
          echo "Reference: $tag ($commit)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Same key as the noble job (#219); only restored.
      - name: Restore CPM cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: cpm_cache
          key: cpm-Linux-noble-${{ hashFiles('3rdparty/CMakeLists.txt', 'cmake/CPM.cmake') }}
          restore-keys: |
            cpm-Linux-noble-

      - uses: ./.github/actions/logsquirl-version
      - uses: ./.github/actions/prepare-workspace-env

      - name: Remember the version
        id: version
        run: echo "version=$LOGSQUIRL_VERSION" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/docker-pull-or-build
        with:
          image: ${{ matrix.config.image }}
          container_root: ${{ matrix.config.container_root }}

      # RelWithDebInfo with LTO, as the noble job builds and ships it; a debug
      # build's numbers say nothing about performance.
      - uses: ./.github/actions/docker-build

      # With Sentry, logsquirl starts its crash handler from its own
      # directory, which is part of what its startup costs.
      - name: Keep this commit's binaries
        run: |
          set -euo pipefail
          mkdir -p "$RUN_DIR/current/bin"
          for binary in logsquirl logsquirl_grep logsquirl_crashpad_handler; do
            cp "$LOGSQUIRL_BUILD_ROOT/output/$binary" "$RUN_DIR/current/bin/"
          done

      # -----------------------------------------------------------------
      # The reference build (#685): the release's code in this commit's
      # container and build options, so the ratio shows what the code
      # changed, on whatever CPU model the runner has. Cached by tag,
      # container and options: built once per release (or container change).
      # -----------------------------------------------------------------
      - name: Name the reference build
        id: reference_key
        if: steps.reference.outputs.tag != ''
        env:
          TAG: ${{ steps.reference.outputs.tag }}
          COMMIT: ${{ steps.reference.outputs.commit }}
        run: |
          set -euo pipefail
          key=$(printf '%s\n' "$TAG" "$COMMIT" "$LOGSQUIRL_CONTAINER" "$LOGSQUIRL_CMAKE_OPTS" | sha256sum | cut -d ' ' -f 1)
          echo "key=perf-reference-$key" >> "$GITHUB_OUTPUT"

      - name: Restore the reference build
        id: reference_cache
        if: steps.reference.outputs.tag != ''
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: perf-run/reference/bin
          key: ${{ steps.reference_key.outputs.key }}

      # The build of the reference runs in this commit's build_root, so it
      # recompiles only what differs from the release and links just the
      # programs the suite starts: logsquirl, logsquirl_grep and the crash
      # handler logsquirl starts. The composite actions come from this
      # commit, not from the release, which may predate their inputs.
      - name: Check out the reference
        id: reference_checkout
        if: steps.reference.outputs.tag != '' && steps.reference_cache.outputs.cache-hit != 'true'
        env:
          COMMIT: ${{ steps.reference.outputs.commit }}
        run: |
          set -euo pipefail
          mkdir -p "$RUN_DIR/tools"
          git archive HEAD .github | tar -x -C "$RUN_DIR/tools"
          git -c advice.detachedHead=false checkout --force --detach "$COMMIT"

      # sccache-cache reuse: the cache this commit's build saved stays as it
      # is; the release's objects never reach the noble job. crashpad_handler
      # is the target of logsquirl_crashpad_handler (3rdparty/CMakeLists.txt),
      # built from the release's tree; logsquirl's post-build step copies it
      # into output/ beside logsquirl, over this commit's copy.
      - name: Build the reference
        id: reference_build
        if: steps.reference_checkout.outcome == 'success'
        continue-on-error: true
        uses: ./perf-run/tools/.github/actions/docker-build
        with:
          targets: logsquirl logsquirl_grep crashpad_handler
          sccache-cache: reuse

      # All three from the reference build, as for this commit above.
      - name: Keep the reference binaries
        id: reference_binaries
        if: steps.reference_build.outcome == 'success'
        run: |
          set -euo pipefail
          mkdir -p "$RUN_DIR/reference/bin"
          for binary in logsquirl logsquirl_grep logsquirl_crashpad_handler; do
            cp "$LOGSQUIRL_BUILD_ROOT/output/$binary" "$RUN_DIR/reference/bin/"
          done

      # Like the sccache cache, only a run of the default branch saves.
      - name: Save the reference build
        if: >-
          steps.reference_binaries.outcome == 'success'
          && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: perf-run/reference/bin
          key: ${{ steps.reference_key.outputs.key }}

      - name: Return to this commit
        if: always() && steps.reference_checkout.outcome != 'skipped'
        run: git -c advice.detachedHead=false checkout --force --detach "$GITHUB_SHA"

      - name: Warn about a missing reference build
        if: steps.reference_build.outcome == 'failure'
        env:
          TAG: ${{ steps.reference.outputs.tag }}
        run: echo "::warning::The reference $TAG did not build; this run has no ratios"

      # -----------------------------------------------------------------
      # Measure both, on this runner, one after the other
      # -----------------------------------------------------------------
      # The 10, 50 and 100 MB files, the 100 MB and 1 GB Log Files and the
      # Log Files the scroll cases scroll through (#669) are generated, not
      # checked in.
      - name: Generate the e2e test data
        run: python3 tests/e2e/generate_test_data.py

      # The suite starts logsquirl only through its isolated instances
      # (tests/e2e/isolated_instance.py: own HOME and XDG directories), in the
      # container it was built in. --no-baseline-compare: baseline.json was
      # recorded on another machine; perf-history.py compares instead.
      - name: Run the e2e performance suite
        env:
          E2E_RUNS: ${{ inputs.e2e_runs || 21 }}
        run: |
          set -euo pipefail
          mkdir -p "$RESULT_DIR"
          .github/scripts/perf-run-suite.sh "$RUN_DIR/current/bin" "$RESULT_DIR"

      # This commit's suite on the release's binaries: a scenario the release
      # does not have skips there, and a benchmark that fails is left out;
      # perf-history.py takes the ratio of what both measured.
      - name: Run the e2e performance suite on the reference
        if: steps.reference_cache.outputs.cache-hit == 'true' || steps.reference_binaries.outcome == 'success'
        env:
          E2E_RUNS: ${{ inputs.e2e_runs || 21 }}
          TAG: ${{ steps.reference.outputs.tag }}
          COMMIT: ${{ steps.reference.outputs.commit }}
        run: |
          set -euo pipefail
          mkdir -p "$RESULT_DIR/reference"
          echo "$TAG" > "$RESULT_DIR/reference/tag.txt"
          echo "$COMMIT" > "$RESULT_DIR/reference/commit.txt"
          if ! .github/scripts/perf-run-suite.sh "$RUN_DIR/reference/bin" "$RESULT_DIR/reference"; then
            echo "::warning::Not every benchmark ran on the reference $TAG; the ratios cover the others"
          fi

      # A skipped benchmark (a missing test file, a missing tool) would leave
      # a hole in the history without failing anything.
      - name: Check that no benchmark was skipped
        run: |
          set -euo pipefail
          python3 - "$RESULT_DIR/junit.xml" <<'EOF'
          import sys
          import xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          skipped = [(case.get("name"), s.get("message", ""))
                     for case in root.iter("testcase") for s in case.findall("skipped")]
          for name, message in skipped:
              print(f"::error::{name} was skipped: {message}")
          sys.exit(1 if skipped else 0)
          EOF

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: perf-result
          path: perf-result
          if-no-files-found: error

  count:
    name: Performance / count instructions
    # As in instruction-counts.yml (#671): the noble job's container and
    # options, its caches only restored.
    strategy:
      matrix:
        config:
          - arch: x64
            artifacts_id: noble
            container_root: docker/ubuntu24.04
            image: ghcr.io/64x-lunicorn/logsquirl-ubuntu-noble
            cmake_opts:

    runs-on: ubuntu-24.04
    # One side of a pull request's count takes about 17 minutes with a warm
    # sccache; larger Log Files make the counting itself longer.
    timeout-minutes: 120
    permissions:
      contents: read
      packages: read # pull the signed build container from GHCR
    env:
      # instruction-counts-side.sh's layout: the scripts under tools/, the
      # dumps and the side file under dumps/ and report/.
      RUN_DIR: instruction-counts-run
      LOGSQUIRL_BENCHMARK_LOG_FILE_MB: ${{ inputs.count_log_file_mb || 32 }}
      LOGSQUIRL_BENCHMARK_SESSION_LOG_FILE_MB: ${{ inputs.count_log_file_mb || 32 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lay out the run directory
        run: |
          set -euo pipefail
          mkdir -p "$RUN_DIR/tools" "$RUN_DIR/report" "$RUN_DIR/dumps/after"
          cp -R .github "$RUN_DIR/tools/"
          # Counts compare only between runners of one CPU model (glibc picks
          # its string functions by CPU): the record job keeps it with them.
          sed -n 's/^model name[[:space:]]*: //p' /proc/cpuinfo | head -n 1 > "$RUN_DIR/report/cpu.txt"
          echo "$LOGSQUIRL_BENCHMARK_LOG_FILE_MB" > "$RUN_DIR/report/log_file_mb.txt"
          echo "CPU: $(cat "$RUN_DIR/report/cpu.txt"); Log Files of $LOGSQUIRL_BENCHMARK_LOG_FILE_MB MiB"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore CPM cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: cpm_cache
          key: cpm-Linux-noble-${{ hashFiles('3rdparty/CMakeLists.txt', 'cmake/CPM.cmake') }}
          restore-keys: |
            cpm-Linux-noble-

      - name: Restore sccache cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: sccache_cache
          key: sccache-Linux-noble-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            sccache-Linux-noble-

      - uses: ./.github/actions/logsquirl-version
      - uses: ./.github/actions/prepare-workspace-env

      - uses: ./.github/actions/docker-pull-or-build
        with:
          image: ${{ matrix.config.image }}
          container_root: ${{ matrix.config.container_root }}

      # A binary that fails leaves its benchmarks out of after.json, and the
      # record job reports them missing; only a side file that was not
      # written at all fails here.
      - name: Count
        run: |
          set -euo pipefail
          status=0
          "$RUN_DIR/tools/.github/scripts/instruction-counts-side.sh" after || status=$?
          if [ ! -f "$RUN_DIR/report/after.json" ]; then
            echo "::error::No counts were written"
            exit 1
          fi
          if [ "$status" != 0 ]; then
            echo "::warning::Not every benchmark binary ran to its end; their benchmarks are reported missing"
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: perf-instruction-counts
          path: instruction-counts-run/report
          if-no-files-found: error

      # The Callgrind dumps, to see where the instructions went.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: perf-instruction-counts-dumps
          path: instruction-counts-run/dumps
          if-no-files-found: ignore
          retention-days: 7

  record:
    name: Performance / compare and record
    needs: [measure, count]
    # The wall-clock is recorded even when the counting failed: the counts
    # are then reported missing, which is a finding of its own.
    if: ${{ !cancelled() && needs.measure.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # push the result to the data branch
    # One writer at a time, whatever the ref: the push is then a fast-forward.
    concurrency:
      group: performance-data-branch
      cancel-in-progress: false
    outputs:
      dest: ${{ steps.compare.outputs.dest }}
      findings: ${{ steps.compare.outputs.findings }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      # Only the scripts and the Budgets; nothing of the build runs in this job.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/scripts
            tests/e2e/budgets.json
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: perf-result
          path: perf-result

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.count.result == 'success'
        with:
          name: perf-instruction-counts
          path: perf-counts

      # The first run creates the branch, with no history of master's code.
      - name: Check out the data branch
        run: |
          set -euo pipefail
          gh auth setup-git
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          if git ls-remote --exit-code --heads "$url" "$DATA_BRANCH" > /dev/null; then
            git clone --quiet --depth 1 --single-branch --branch "$DATA_BRANCH" "$url" perf-data
          else
            echo "::notice::$DATA_BRANCH does not exist yet; this run creates it"
            git init --quiet --initial-branch "$DATA_BRANCH" perf-data
            git -C perf-data remote add origin "$url"
            cat > perf-data/README.md <<'EOF'
          # Performance history

          Written by the Performance workflow (.github/workflows/performance.yml on
          master), one JSON file per run: `history/` for runs of master, `trial/` for
          runs dispatched from other branches. `trend.csv` has one row per `history/`
          run. BUILD.md ("Nightly performance") explains the comparison. Do not
          edit by hand; do not delete the branch, it is the only copy.
          EOF
          fi

      - name: Find the change points, check the Budgets and record the run
        id: compare
        env:
          ACCEPT: ${{ inputs.accept_new_level && 'true' || 'false' }}
          DEFAULT_REF: refs/heads/${{ github.event.repository.default_branch }}
          VERSION: ${{ needs.measure.outputs.version }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" = "$DEFAULT_REF" ]; then
            dest=history
          else
            dest=trial
          fi
          accept=()
          if [ "$ACCEPT" = true ]; then
            if [ "$dest" != history ]; then
              echo "::error::accept_new_level applies to runs of the default branch only"
              exit 2
            fi
            accept=(--accept)
          fi
          counts=()
          if [ -f perf-counts/after.json ]; then
            counts=(--instruction-counts perf-counts/after.json
                    --counts-cpu "$(cat perf-counts/cpu.txt)"
                    --counts-log-file-mb "$(cat perf-counts/log_file_mb.txt)")
          else
            echo "::warning::No instruction counts in this run"
          fi
          # The ratio to the reference build (#685), when it was measured.
          reference=()
          if [ -f perf-result/reference/benchmark_report.json ]; then
            reference=(--reference-report perf-result/reference/benchmark_report.json
                       --reference-tag "$(cat perf-result/reference/tag.txt)"
                       --reference-commit "$(cat perf-result/reference/commit.txt)")
          else
            echo "::warning::No reference build was measured in this run; no ratios"
          fi
          status=0
          python3 .github/scripts/perf-history.py record \
            --report perf-result/benchmark_report.json --data-dir perf-data --dest "$dest" \
            --commit "$GITHUB_SHA" --ref "$GITHUB_REF" --run-id "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --version "$VERSION" --budgets tests/e2e/budgets.json "${counts[@]}" "${reference[@]}" "${accept[@]}" \
            --markdown perf-result/comparison.md --json perf-result/comparison.json || status=$?
          # 2: the input was unusable and nothing was recorded.
          if [ "$status" -ge 2 ]; then
            exit "$status"
          fi
          cat perf-result/comparison.md >> "$GITHUB_STEP_SUMMARY"
          echo "dest=$dest" >> "$GITHUB_OUTPUT"
          echo "findings=$([ "$status" = 1 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      # The run is recorded whether it has findings or not: it is what was
      # measured.
      - name: Push the run to the data branch
        env:
          DEST: ${{ steps.compare.outputs.dest }}
        run: |
          set -euo pipefail
          cd perf-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit --quiet -m "perf: record run $GITHUB_RUN_ID in $DEST (${GITHUB_SHA:0:12}, $GITHUB_REF_NAME)"
          git push --quiet origin "HEAD:refs/heads/$DATA_BRANCH"
          echo "Recorded in $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/tree/$DATA_BRANCH/$DEST"

      # What the issues job files from.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: perf-comparison
          path: perf-result/comparison.json
          if-no-files-found: error

      # A run of a branch files no issue: its findings are in the summary,
      # and the run is red.
      - name: Fail on a finding of a branch
        if: steps.compare.outputs.findings == 'true' && steps.compare.outputs.dest != 'history'
        run: |
          echo "::error::The run has findings (see the job summary); a run of a branch files no issue"
          exit 1

  issues:
    name: Performance / file issues
    needs: record
    if: needs.record.outputs.dest == 'history' && needs.record.outputs.findings == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read # check out the scripts
      issues: write # open, edit and comment on the issues of a regression
    concurrency:
      group: performance-issues
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      # The default branch's scripts; nothing of the build.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: perf-comparison
          path: perf-comparison

      # perf-issues.py decides per scenario whether to open an issue, update
      # the open one or leave a closed one closed, and writes the texts. It
      # gets every issue, open or closed, whose body holds the marker the
      # workflow writes into each one (perf-issues.py MARKER), whatever its
      # labels: a closed issue with the same findings keeps them from being
      # filed again.
      - name: Plan the issues
        run: |
          set -euo pipefail
          gh issue list --repo "$GITHUB_REPOSITORY" --state all --limit 1000 \
            --search '"logsquirl-nightly-performance" in:body' \
            --json number,state,title,body > issues.json
          python3 .github/scripts/perf-issues.py plan --comparison perf-comparison/comparison.json \
            --issues issues.json --server-url "$GITHUB_SERVER_URL" --repo "$GITHUB_REPOSITORY" \
            --out plan

      - name: File the issues
        run: |
          set -euo pipefail
          jq -c '.[]' plan/plan.json | while IFS= read -r item; do
            action=$(jq -r '.action' <<<"$item")
            number=$(jq -r '.number // empty' <<<"$item")
            body=$(jq -r '.body_file // empty' <<<"$item")
            case "$action" in
              create)
                title=$(jq -r '.title' <<<"$item")
                url=$(gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file "$body" \
                  --label needs-triage --label performance)
                echo "::error::Opened $url"
                ;;
              edit)
                gh issue edit "$number" --repo "$GITHUB_REPOSITORY" --body-file "$body" > /dev/null
                echo "::error::Updated $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/issues/$number"
                ;;
              comment)
                gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body-file "$body" > /dev/null
                ;;
              skip)
                echo "::warning::Issue $number was closed for these findings; left closed"
                ;;
              *)
                echo "::error::The plan holds an unknown action: $action"
                exit 1
                ;;
            esac
          done

      # The issue is where a regression is acted on; the run is red as well
      # while a finding stands.
      - name: Fail on a finding
        run: |
          echo "::error::The run has findings; see the job summary of the record job and the issues above"
          exit 1

  # The Performance page of the website draws the perf-data branch (#678).
  # Once a run of the default branch is recorded there, Deploy Website
  # rebuilds the last release's site with it; it deploys no newer website
  # code (#350). Deploy Website runs from master in its own `website`
  # environment, as when CI Release dispatches it.
  website:
    name: Performance / update the trend page
    needs: record
    if: needs.record.outputs.dest == 'history'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write # dispatch Deploy Website
    steps:
      - name: Dispatch Deploy Website
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-website.yml --repo "$GITHUB_REPOSITORY" --ref master -f performance_trend=true
