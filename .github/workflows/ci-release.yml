name: "CI Release"

# A release does not build (#221). It publishes the packages of the successful
# CI Build run for the push to master that built the tagged commit: the build
# that passed CI. Those packages are unsigned; this workflow signs and
# notarizes the macOS ones in the `release` environment (#203), adds the SBOM,
# checksums, attestations and signature, and publishes. The binaries carry the
# tag's version because CI Build takes YY.MM.PATCH from project(VERSION) in
# CMakeLists.txt, and prepare refuses a build whose version is not the tag's.
on:
  push:
    tags:
      - 'v*'
  # Dispatch it from the release tag ("Use workflow from: <tag>", or
  # `gh workflow run ci-release.yml --ref <tag> -f tag=<tag>`): the `release`
  # environment holding the signing and Sentry secrets admits only v* tags (#203).
  workflow_dispatch:
    inputs:
      ci-run-id:
        description: "Run ID of the successful CI Build push run on master for the tagged commit (leave empty to find it)"
        required: false
      tag:
        description: "The release tag this workflow is dispatched from (e.g. v26.04.0, v26.04.0-beta1); push it first, workflows cannot create v* tags"
        required: true

concurrency:
  group: ci-release-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions: {}

jobs:
  # ── Job 1: Find, download and check the build of the tagged commit ────
  prepare:
    runs-on: ubuntu-24.04
    # Every job has a budget of about twice its slowest successful run, so a
    # hang cannot hold the release for the 6-hour default. Slowest successful
    # run 1.4 min, mostly artifact downloads (#218).
    timeout-minutes: 10
    permissions:
      contents: read
      # Read the CI Build run's metadata and artifacts (#197, #221).
      actions: read
    outputs:
      version: ${{ steps.build.outputs.version }}
      tag: ${{ steps.tag.outputs.tag }}
      is_prerelease: ${{ steps.tag.outputs.is_prerelease }}
      commit: ${{ steps.commit.outputs.commit }}
      ci_run_id: ${{ steps.run.outputs.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The tag and the given CI run are validated before anything is
      # downloaded. Inputs arrive via env, never interpolated into a script (#197).
      - name: Resolve the release tag
        id: tag
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            if [ -z "$RELEASE_TAG" ]; then
              echo "::error::A manual release needs the 'tag' input (e.g. v26.04.0)."
              exit 1
            fi
            # The signing and Sentry jobs run in the `release` environment,
            # which admits only v* tags; a dispatch from a branch would fail
            # there after the build has been downloaded (#203).
            if [ "$GITHUB_REF" != "refs/tags/$RELEASE_TAG" ]; then
              echo "::error::Dispatch CI Release from the tag itself (Use workflow from: $RELEASE_TAG), not from '$GITHUB_REF'."
              exit 1
            fi
          fi
          .github/scripts/release-build.py check-tag --tag "$GITHUB_REF_NAME"

      - name: Ensure the tag points to a commit on master
        id: commit
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          # Dereference annotated tags to the underlying commit
          COMMIT_SHA=$(git rev-parse --verify "refs/tags/$TAG^{commit}")
          echo "Resolved commit: $COMMIT_SHA"
          # grep reads all input (no -q): under pipefail, grep -q exiting early
          # could fail git with SIGPIPE and misreport the tag as off master (#218).
          if ! git branch -r --contains "$COMMIT_SHA" | grep 'origin/master' > /dev/null; then
            echo "::error::Release tags must be on the master branch. Tag $TAG points to $COMMIT_SHA, which is not on master."
            exit 1
          fi
          echo "commit=$COMMIT_SHA" >> "$GITHUB_OUTPUT"

      # The release notes are the tag's CHANGELOG section, and recording the
      # release in the update feed needs the feed's changelog entry. Checked
      # here, so a missing one stops the release before anything is signed
      # (#307, #310).
      - name: Check the CHANGELOG section and the feed entry of the tag
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          .github/scripts/release-build.py release-notes --tag "$TAG" --out "$RUNNER_TEMP/release_notes.md"
          .github/scripts/release-feed.py check-tag --tag "$TAG"

      # Only a successful CI Build that ran for a push to master and built the
      # tagged commit may be released: pull request builds come from
      # unreviewed branches, and a build of another commit is not what the tag
      # names (#197, #221). The script also picks the release artifacts of
      # that run and checks they belong to it and to the commit.
      - name: Find the CI Build run of the tagged commit
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ steps.commit.outputs.commit }}
          CI_RUN_ID: ${{ github.event.inputs.ci-run-id }}
        run: |
          set -euo pipefail
          .github/scripts/release-build.py find-run --repository "$GITHUB_REPOSITORY" \
            --commit "$COMMIT" --run-id "$CI_RUN_ID"

      # By artifact ID, so exactly the artifacts find-run checked; the action
      # fails when a download does not match the artifact's digest. Each
      # artifact lands in a directory named after it.
      - name: Download the build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.run.outputs.run_id }}
          artifact-ids: ${{ steps.run.outputs.artifact_ids }}
          path: build

      # The version must be the tag's: set project(VERSION) in CMakeLists.txt
      # on master before tagging (BUILD.md, "Version Numbering").
      - name: Check the build against the tag
        id: build
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          COMMIT: ${{ steps.commit.outputs.commit }}
        run: |
          set -euo pipefail
          ls -R build
          .github/scripts/release-build.py check-build --tag "$TAG" --commit "$COMMIT" --root build

      # Re-upload for the later jobs. The macOS packages go to sign-mac first;
      # later jobs take its signed ones.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-artifacts
          path: |
            build/packages-*/**
            !build/packages-mac-arm64/**
            build/logsquirl_version/**
            build/sbom-base/**
          if-no-files-found: error

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unsigned-mac-arm64
          path: build/packages-mac-arm64/*
          if-no-files-found: error

  # ── Job 2: Sign and notarize macOS ─────────────────────────────────────
  # The only job holding the Apple secrets, and only through the `release`
  # environment, whose deployment policy admits v* tags alone (#203). It signs
  # the app of the unsigned build, notarizes and staples it, packs and
  # notarizes the DMG again, and hands the signed files to sbom and release.
  sign-mac:
    runs-on: macos-26
    needs: [prepare]
    environment: release
    # Two notarization round trips to Apple; CI Build's Mac job used to spend
    # up to about 15 minutes on them (#218).
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      # Entitlements, DMG background and volume icon of the tagged commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: unsigned-mac-arm64
          path: packages-mac-arm64

      - uses: ./.github/actions/mac-sign-notarize
        with:
          packages-dir: packages-mac-arm64
          arch: arm64
          p12-file-base64: ${{ secrets.MACOS_P12_FILE }}
          p12-password: ${{ secrets.MACOS_P12_PASSWORD }}
          notarization-username: ${{ secrets.APPLE_ID }}
          notarization-team: ${{ secrets.APPLE_TEAM_ID }}
          notarization-password: ${{ secrets.APPLE_PASSWORD }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-mac-arm64
          path: packages-mac-arm64/*
          if-no-files-found: error

  # ── Job 3: Sentry release + symbol upload ──────────────────────────────
  # SENTRY_TOKEN is a secret of the `release` environment (#203).
  sentry:
    runs-on: ubuntu-24.04
    needs: [prepare]
    environment: release
    permissions:
      contents: read
    continue-on-error: true
    # Slowest successful run 3 min (#218).
    timeout-minutes: 15
    env:
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_TOKEN }}
      SENTRY_ORG: logsquirl
      SENTRY_PROJECT: logsquirl
      LOGSQUIRL_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Skip if no Sentry token
        if: ${{ !env.SENTRY_AUTH_TOKEN }}
        run: echo "::warning::SENTRY_TOKEN not set — skipping Sentry release" && exit 0

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifacts

      # The symbols need not wait for signing: codesign leaves the Mach-O
      # UUIDs that match the dSYM unchanged.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: unsigned-mac-arm64
          path: packages-mac-arm64

      # A pinned sentry-cli release checked against its SHA-256 (#200, #211).
      - uses: ./.github/actions/install-sentry-cli

      - name: Create Sentry release
        run: |
          set -euo pipefail
          sentry-cli releases new "$LOGSQUIRL_VERSION"
          sentry-cli releases set-commits --auto "$LOGSQUIRL_VERSION"

      - name: Upload symbols linux
        run: |
          set -euo pipefail
          for id in noble oracle fedora appimage; do
            if [ -f "./packages-${id}/logsquirl_${id}.debug.xz" ]; then
              xz -d "./packages-${id}/logsquirl_${id}.debug.xz"
              sentry-cli upload-dif "./packages-${id}/logsquirl_${id}.debug" "./packages-${id}/logsquirl_${id}"
            fi
          done

      - name: Upload symbols mac
        run: |
          set -euo pipefail
          # One command per line: set -e ignores a failure inside an && list (#218).
          cd ./packages-mac-arm64
          tar xzf logsquirl-arm64.app.tar.gz
          tar xzf logsquirl-arm64.dSym.tar.gz
          cd ..
          sentry-cli upload-dif ./packages-mac-arm64/logsquirl.app/Contents/MacOS/logsquirl ./packages-mac-arm64/logsquirl.dSym

      - name: Upload symbols win
        run: |
          sentry-cli upload-dif ./packages-windows-x64/logsquirl-win-x64-pdb.zip

  # ── Job 4: SBOM ────────────────────────────────────────────────────────
  # Completes the source SBOM that CI Build generated from the commit it built
  # (sbom-base: CPM packages and pinned platform components) with what the
  # built packages bundle: the Qt, OpenSSL and ICU versions found in the
  # AppImage, the Windows portable zip and the macOS app, and whatever syft
  # finds in them. The source part comes from the released build run, which
  # built the tagged commit (#221).
  # Packages are only unpacked, never executed, and this job holds no write
  # permission (#212).
  sbom:
    runs-on: ubuntu-24.04
    # Unpacking three packages and a syft scan; no run history yet (#218).
    timeout-minutes: 20
    needs: [prepare, sign-mac]
    permissions:
      contents: read
    env:
      LOGSQUIRL_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifacts

      # The SBOM describes the macOS app that is published: the signed one.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: signed-mac-arm64
          path: packages-mac-arm64

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install SBOM tooling
        run: |
          pip install --require-hashes -r scripts/sbom/requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y -qq squashfs-tools

      - name: Unpack the packages that bundle libraries
        run: |
          set -euo pipefail
          shopt -s nullglob
          # Exactly one package per kind, or the scan would describe the wrong file.
          appimage=(./packages-appimage/*.AppImage)
          portable=(./packages-windows-x64/*-portable.zip)
          macapp=(./packages-mac-arm64/*.app.tar.gz)
          for n in "${#appimage[@]}" "${#portable[@]}" "${#macapp[@]}"; do
            if [ "$n" -ne 1 ]; then
              echo "::error::Expected one AppImage, portable zip and macOS app archive: ${appimage[*]} ${portable[*]} ${macapp[*]}"
              exit 1
            fi
          done
          scan="$RUNNER_TEMP/sbom-scan"
          mkdir -p "$scan/windows" "$scan/macos"
          # The SquashFS payload is read at its offset instead of running the
          # AppImage with --appimage-extract.
          offset=$(python scripts/sbom/logsquirl_sbom.py appimage-offset "${appimage[0]}")
          unsquashfs -no-progress -no-xattrs -o "$offset" -d "$scan/appimage" "${appimage[0]}" > /dev/null
          unzip -q "${portable[0]}" -d "$scan/windows"
          tar -xzf "${macapp[0]}" -C "$scan/macos"

      - name: Scan the packages with syft
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: ${{ runner.temp }}/sbom-scan
          format: cyclonedx-json
          output-file: ${{ runner.temp }}/syft.cdx.json
          upload-artifact: false
          upload-release-assets: false

      # --require-detected: a packaging change that stops bundling (or moves)
      # Qt, OpenSSL or ICU must be looked at, not silently leave them unversioned.
      - name: Merge and validate the release SBOM
        run: |
          set -euo pipefail
          scan="$RUNNER_TEMP/sbom-scan"
          sbom="sbom/logsquirl-${LOGSQUIRL_VERSION}-sbom.cdx.json"
          python scripts/sbom/logsquirl_sbom.py merge --base sbom-base/logsquirl-sbom-base.cdx.json \
            --scan "appimage=$scan/appimage" --scan "windows=$scan/windows" --scan "macos=$scan/macos" \
            --syft "$RUNNER_TEMP/syft.cdx.json" --require-detected qt,openssl,icu --output "$sbom"
          python scripts/sbom/logsquirl_sbom.py validate "$sbom"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-sbom
          path: sbom/*.cdx.json
          if-no-files-found: error

  # ── Job 5: Vulnerability scan ──────────────────────────────────────────
  # Scans the release SBOM: grype matches the components with a CPE (Qt,
  # Boost and the Qt, OpenSSL and ICU builds found in the packages), OSV the
  # CPM packages by pinned commit and tag. A critical finding (CVSS v3/v4 base
  # score >= 9.0 or rated critical) that scripts/sbom/vuln-ignore.yml does not
  # accept fails this job, and the release job does not run. Every finding goes
  # to code scanning, also when the gate fails (#213).
  vuln-scan:
    runs-on: ubuntu-24.04
    # grype database download plus a few OSV requests; no run history yet (#218).
    timeout-minutes: 15
    needs: [prepare, sbom]
    permissions:
      contents: read
      security-events: write # upload the SARIF to code scanning
    steps:
      # The scanner comes from this workflow's ref; the ignore file always
      # comes from master. A release tag cannot be moved (#201), so a risk
      # accepted on master through a reviewed PR must also reach a re-run of
      # a tag release (#213).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Take the ignore file from master
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/contents/scripts/sbom/vuln-ignore.yml?ref=master" \
            -H "Accept: application/vnd.github.raw" > scripts/sbom/vuln-ignore.yml

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-sbom
          path: release-sbom

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install SBOM tooling
        run: pip install --require-hashes -r scripts/sbom/requirements.txt

      - name: Scan the release SBOM
        uses: ./.github/actions/sbom-vuln-scan
        with:
          sbom: release-sbom/logsquirl-${{ needs.prepare.outputs.version }}-sbom.cdx.json
          sarif: sbom-vulns.sarif
          fail-on: critical
          nvd-api-key: ${{ secrets.NVD_API_KEY }}

      - name: Upload to code scanning
        if: ${{ !cancelled() && hashFiles('sbom-vulns.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: sbom-vulns.sarif
          category: sbom-vulns

  # ── Job 6: Publish GitHub Release ──────────────────────────────────────
  release:
    runs-on: ubuntu-24.04
    needs: [prepare, sign-mac, sentry, sbom, vuln-scan]
    # sentry may fail (continue-on-error); a release without signed macOS
    # packages, without its SBOM, or with a critical vulnerability nobody
    # accepted, may not (#203, #212, #213).
    if: >-
      always() && needs.prepare.result == 'success' && needs.sign-mac.result == 'success'
      && needs.sbom.result == 'success' && needs.vuln-scan.result == 'success'
    # Slowest successful run 5 min, mostly asset uploads (#218).
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      LOGSQUIRL_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifacts

      # The signed, notarized and stapled DMG and app archive (#203), so the
      # checksum file, the upload and the attestations cover the final files.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: signed-mac-arm64
          path: packages-mac-arm64

      # Its own asset directory, so the checksum file, the upload and the
      # provenance attestation cover the SBOM like every other asset (#212).
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-sbom
          path: packages-sbom

      - name: Cleanup release artifacts
        run: |
          set -euo pipefail
          # Remove uncompressed binaries (only keep packages)
          for id in noble oracle fedora appimage; do
            rm -f "./packages-${id}/logsquirl_${id}"
          done

          # Remove extracted app/dSym bundles (keep tar.gz archives)
          rm -rf ./packages-mac-arm64/logsquirl.app ./packages-mac-arm64/logsquirl.dSym

          # Collect debug symbols into a single archive. A platform without
          # symbols is skipped, but a failing xz or mv stops the release instead
          # of being swallowed by a trailing `|| true` (#218).
          mkdir -p ./linux-debug
          for id in noble oracle fedora appimage; do
            if [ -f "./packages-${id}/logsquirl_${id}.debug" ]; then
              mv "./packages-${id}/logsquirl_${id}.debug" ./linux-debug/
            fi
            if [ -f "./packages-${id}/logsquirl_${id}.debug.xz" ]; then
              xz -d "./packages-${id}/logsquirl_${id}.debug.xz"
              mv "./packages-${id}/logsquirl_${id}.debug" ./linux-debug/
            fi
          done
          if ls ./linux-debug/*.debug 1>/dev/null 2>&1; then
            tar -cJf ./logsquirl-$LOGSQUIRL_VERSION-symbols.tar.xz -C ./linux-debug .
            rm -f ./linux-debug/*.debug
            mv ./logsquirl-$LOGSQUIRL_VERSION-symbols.tar.xz ./linux-debug/
          fi

      - name: Prepare binary artifacts
        run: |
          set -euo pipefail
          mkdir -p ./packages-bin
          # The deps archive is optional; a failing mv is not (#218).
          if [ -f "./packages-appimage/logsquirl_deps.tar.xz" ]; then
            mv ./packages-appimage/logsquirl_deps.tar.xz "./packages-bin/logsquirl-$LOGSQUIRL_VERSION-deps.tar.xz"
          fi
          cp ./logsquirl_version/logsquirl_version.txt ./packages-bin/

      - name: Prepare checksums
        id: assets
        run: |
          set -euo pipefail
          shopt -s nullglob

          # The one list of directories whose files become release assets. The
          # publish step takes its globs from this step's output, so the checksum
          # file and the uploaded assets cannot drift apart (#196).
          required_dirs=(packages-windows-x64 packages-noble packages-oracle
                         packages-fedora packages-appimage packages-mac-arm64
                         packages-bin packages-sbom)
          # Symbols are only archived when a Linux build produced .debug files.
          optional_dirs=(linux-debug)
          checksum_name="logsquirl-${LOGSQUIRL_VERSION}-sha256.txt"

          # A platform that did not deliver must stop the release, not ship a
          # release (and checksum file) without it (#196).
          missing=0
          for dir in "${required_dirs[@]}"; do
            found=0
            for f in "./$dir"/*; do
              if [ -f "$f" ]; then found=1; break; fi
            done
            if [ "$found" -eq 0 ]; then
              echo "::error::Release asset directory '$dir' is missing or has no files"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1

          # Entries use basenames: users verify with 'sha256sum -c' inside the
          # folder they downloaded the assets to. Release assets share one flat
          # namespace, so a duplicate name would also clobber an upload.
          names=()
          checksums="$RUNNER_TEMP/$checksum_name"
          : > "$checksums"
          for dir in "${required_dirs[@]}" "${optional_dirs[@]}"; do
            for f in "./$dir"/*; do
              [ -f "$f" ] || continue
              name="${f##*/}"
              [ "$name" != "$checksum_name" ] || continue
              names+=("$name")
              (cd "./$dir" && sha256sum --binary -- "$name") >> "$checksums"
            done
          done
          duplicates=$(printf '%s\n' "${names[@]}" | sort | uniq -d)
          if [ -n "$duplicates" ]; then
            echo "::error::Release asset names are not unique: $duplicates"
            exit 1
          fi
          mv "$checksums" "./packages-bin/$checksum_name"
          cat "./packages-bin/$checksum_name"
          # The signing step signs this file; its bundle is not a checksum entry (#214).
          echo "checksum_file=./packages-bin/$checksum_name" >> "$GITHUB_OUTPUT"

          {
            echo "files<<RELEASE_ASSET_GLOBS"
            for dir in "${required_dirs[@]}" "${optional_dirs[@]}"; do
              echo "./$dir/*"
            done
            echo "RELEASE_ASSET_GLOBS"
            # The SBOM attestation binds the SBOM to every other asset (#212).
            echo "sbom_subjects<<SBOM_SUBJECT_GLOBS"
            for dir in "${required_dirs[@]}" "${optional_dirs[@]}"; do
              [ "$dir" = packages-sbom ] || echo "./$dir/*"
            done
            echo "SBOM_SUBJECT_GLOBS"
          } >> "$GITHUB_OUTPUT"
          sbom_files=(./packages-sbom/*.cdx.json)
          if [ "${#sbom_files[@]}" -ne 1 ]; then
            echo "::error::Expected one SBOM in packages-sbom, found ${#sbom_files[@]}"
            exit 1
          fi
          echo "sbom_file=${sbom_files[0]}" >> "$GITHUB_OUTPUT"

      # The notes are the tag's CHANGELOG section; without one the job fails
      # here, before the draft exists (#307).
      - name: Write release notes
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: .github/scripts/release-build.py release-notes --tag "$TAG" --out release_notes.md

      # The verification commands name this release's files, so they are added
      # here rather than in the CHANGELOG, which knows nothing about assets (#214).
      - name: Append verification instructions
        run: |
          set -euo pipefail
          # A quoted heredoc written to a file (not captured with $(...)) keeps
          # the backslash line continuations of the commands intact.
          template="$RUNNER_TEMP/verifying-downloads.md"
          cat > "$template" <<'NOTES'

          ## Verifying downloads

          Every download is listed in `logsquirl-@VERSION@-sha256.txt`. The
          checksum file is signed with Sigstore (`logsquirl-@VERSION@-sha256.txt.sigstore.json`,
          which is itself not listed in the checksum file), and every asset carries a
          GitHub build provenance attestation. `logsquirl-@VERSION@-sbom.cdx.json` is the
          CycloneDX software bill of materials of this release, attested for every download.

          ```sh
          # 1. Check the signature of the checksum file (needs cosign)
          cosign verify-blob \
            --bundle logsquirl-@VERSION@-sha256.txt.sigstore.json \
            --certificate-identity-regexp '^https://github\.com/64x-lunicorn/LogSquirl/\.github/workflows/ci-release\.yml@refs/tags/v.+$' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            logsquirl-@VERSION@-sha256.txt

          # 2. Check the files you downloaded against it
          sha256sum -c logsquirl-@VERSION@-sha256.txt --ignore-missing

          # 3. Or check a single file's build provenance (needs the GitHub CLI)
          gh attestation verify <file> -R 64x-lunicorn/LogSquirl

          # 4. Check that the SBOM describes that file
          gh attestation verify <file> -R 64x-lunicorn/LogSquirl --predicate-type https://cyclonedx.org/bom
          ```
          NOTES
          section=$(cat "$template")
          printf '%s\n' "${section//@VERSION@/$LOGSQUIRL_VERSION}" >> release_notes.md

      # Publish as a draft first: provenance and signature are created while
      # the release is still invisible, and a failure in any later step leaves
      # a draft instead of a public release without them. A re-run reuses the
      # draft for the same tag (#214). zizmor suggests `gh release` instead; the
      # action's reuse of an existing draft and its multi-line globs would have
      # to be rebuilt in shell, so it stays (#204).
      - name: Create draft release # zizmor: ignore[superfluous-actions]
        id: draft
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: "LogSquirl ${{ needs.prepare.outputs.tag }}"
          body_path: release_notes.md
          prerelease: ${{ needs.prepare.outputs.is_prerelease == 'true' }}
          draft: true
          # Same directory list the checksum file was computed from (#196)
          files: ${{ steps.assets.outputs.files }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Every uploaded asset, the checksum file included, gets a provenance
      # attestation: the subjects are the same globs the draft was built from,
      # so a new asset directory (e.g. an SBOM) is covered automatically (#214).
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.assets.outputs.files }}

      # actions/attest-sbom is deprecated in favour of actions/attest, which
      # takes the same sbom-path input. Verify with
      # gh attestation verify <file> --predicate-type https://cyclonedx.org/bom (#212)
      - name: Attest SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.assets.outputs.sbom_subjects }}
          sbom-path: ${{ steps.assets.outputs.sbom_file }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Keyless signature over the checksum file, bound to this workflow's
      # identity ci-release.yml@refs/tags/v*: a tag push and a manual release
      # both run on the tag, since the release environment admits nothing else
      # (#203), and the regexp in the release notes accepts only that. Releases
      # before #203 could also carry @refs/heads/master; their notes say so.
      # The bundle is created after the checksum file, so it is not
      # (and cannot be) listed in it; users verify it with cosign instead (#214).
      - name: Sign checksum file
        env:
          CHECKSUM_FILE: ${{ steps.assets.outputs.checksum_file }}
        run: |
          set -euo pipefail
          # Written outside the asset directories, so no asset glob can pick it up.
          bundle="$RUNNER_TEMP/${CHECKSUM_FILE##*/}.sigstore.json"
          cosign sign-blob --yes --bundle "$bundle" "$CHECKSUM_FILE"

      - name: Upload signature bundle
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
          CHECKSUM_FILE: ${{ steps.assets.outputs.checksum_file }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" "$RUNNER_TEMP/${CHECKSUM_FILE##*/}.sigstore.json" --clobber

      # Last step: only a release with attestations and a signed checksum file
      # becomes public, and update-metadata only runs once this succeeded (#214).
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_ID: ${{ steps.draft.outputs.id }}
        run: |
          set -euo pipefail
          gh api --method PATCH "repos/$GH_REPO/releases/$RELEASE_ID" -F draft=false --jq '.html_url'

  # ── Job 7: Propose the update feed change ─────────────────────────────
  # latest.json on master is protected like any other file: the ruleset
  # requires a pull request with passing checks, and workflows may not open
  # pull requests here. So the job commits the recorded release to the branch
  # feed/<tag> and names the link to open the pull request from it; the app
  # announces the release once that pull request is merged. The Changelog
  # check needs no entry for a feed/ branch.
  update-metadata:
    runs-on: ubuntu-24.04
    needs: [prepare, release]
    if: needs.release.result == 'success'
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      # The only checkout that keeps its credentials: the job pushes the
      # feed branch with them, and it uploads no artifact that could leak
      # them (#204).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          persist-credentials: true # zizmor: ignore[artipacked]

      - name: Push the update feed change to feed/<tag>
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          IS_PRERELEASE: ${{ needs.prepare.outputs.is_prerelease }}
          BUILD_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          BRANCH="feed/${TAG}"

          # Records the release in the stable or beta fields, the build it was
          # published from and the release list, unless the feed announces a
          # newer build (a re-run of an older release); the result must be a
          # valid feed (#306, #310). BUILD.md documents the fields.
          .github/scripts/release-feed.py record --tag "$TAG" --build "$BUILD_VERSION"
          if git diff --quiet -- latest.json; then
            echo "::notice::latest.json on master already announces ${TAG} or a newer build; nothing to propose."
            exit 0
          fi
          if [ "$IS_PRERELEASE" = "true" ]; then
            COMMIT_MSG="chore: announce beta ${VERSION} in latest.json"
          else
            COMMIT_MSG="chore: announce ${VERSION} in latest.json"
          fi

          # No [skip ci] in the message: GitHub would skip the pull request's
          # required checks. A re-run replaces the branch it pushed before.
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git switch -C "$BRANCH"
          git commit -m "$COMMIT_MSG" -- latest.json
          git push --force origin "$BRANCH"

          url="https://github.com/${GITHUB_REPOSITORY}/compare/master...${BRANCH}?expand=1"
          echo "::notice::Open the pull request that announces ${TAG} in the app: ${url}"
          {
            echo "### Announce ${TAG} in the app"
            echo
            echo "The update feed change is on \`${BRANCH}\`. [Open the pull request](${url}) and merge it once its checks pass."
          } >> "$GITHUB_STEP_SUMMARY"

  # ── Job 8: Deploy the website ──────────────────────────────────────────
  # The deploy leaves out the page of a release that is not published, so a
  # release's page goes live with this deploy, after the release is public
  # (#315). A dispatch with GITHUB_TOKEN may start a workflow; Deploy Website
  # runs from master in its own `website` environment.
  deploy-website:
    runs-on: ubuntu-24.04
    needs: [release]
    if: needs.release.result == 'success'
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Dispatch Deploy Website
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-website.yml --repo "$GITHUB_REPOSITORY" --ref master
