name: "CI Release"

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      ci-run-id:
        description: "Run ID of a successful CI Build push run on master (leave empty to use the last successful one)"
        required: false
      tag:
        description: "Existing release tag (e.g. v26.04.0, v26.04.0-beta1); push it first, workflows cannot create v* tags"
        required: true

concurrency:
  group: ci-release-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions: {}

jobs:
  # ── Job 0: Ensure tag is on master ─────────────────────────────────────
  validate-branch:
    runs-on: ubuntu-24.04
    if: github.event_name == 'push'
    # Every job has a budget of about twice its slowest successful run, so a
    # hang cannot hold the release for the 6-hour default (#218).
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Ensure tag points to a commit on master
        run: |
          set -euo pipefail
          # Dereference annotated tags to the underlying commit
          COMMIT_SHA=$(git rev-parse "$GITHUB_SHA^{commit}" 2>/dev/null || echo "$GITHUB_SHA")
          echo "Resolved commit: $COMMIT_SHA"
          # grep reads all input (no -q): under pipefail, grep -q exiting early
          # could fail git with SIGPIPE and misreport the tag as off master (#218).
          if ! git branch -r --contains "$COMMIT_SHA" | grep 'origin/master' > /dev/null; then
            echo "::error::Release tags must be on the master branch."
            echo "This tag points to a commit that is not on master — aborting release."
            exit 1
          fi

  # ── Job 1: Build (reuse ci-build.yml) ──────────────────────────────────
  # A job that calls a reusable workflow cannot set timeout-minutes; each job
  # inside ci-build.yml carries its own budget (#218).
  build:
    needs: [validate-branch]
    if: github.event_name == 'push'
    uses: ./.github/workflows/ci-build.yml
    permissions:
      contents: read
      packages: read
    # Only the signing secrets ci-build.yml declares, not every secret of the
    # repository (#204).
    secrets:
      MACOS_P12_FILE: ${{ secrets.MACOS_P12_FILE }}
      MACOS_P12_PASSWORD: ${{ secrets.MACOS_P12_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      WIN_CS_KEY_ID: ${{ secrets.WIN_CS_KEY_ID }}
      WIN_CS_SECRET: ${{ secrets.WIN_CS_SECRET }}
      WIN_CS_BUCKET: ${{ secrets.WIN_CS_BUCKET }}
      WIN_SIGN_CERT_PFX: ${{ secrets.WIN_SIGN_CERT_PFX }}
      WIN_SIGN_CERT_PASSWORD: ${{ secrets.WIN_SIGN_CERT_PASSWORD }}

  # ── Job 2: Prepare release metadata ────────────────────────────────────
  prepare:
    runs-on: ubuntu-24.04
    needs: [build]
    if: always() && (needs.build.result == 'success' || github.event_name == 'workflow_dispatch')
    # Slowest successful run 1.4 min, mostly artifact downloads (#218).
    timeout-minutes: 10
    permissions:
      contents: read
      # Read another run's metadata and artifacts on manual dispatch (#197).
      actions: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.tag.outputs.tag }}
      is_prerelease: ${{ steps.tag.outputs.is_prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A manual release must not publish artifacts of an unreviewed build:
      # validate the tag and the given CI run before anything is downloaded.
      # Inputs arrive via env, never interpolated into the script (#197).
      - name: Validate dispatch inputs
        id: dispatch
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.inputs.tag }}
          CI_RUN_ID: ${{ github.event.inputs.ci-run-id }}
        run: |
          set -euo pipefail
          # Accepts the historical formats: v26.04.2, v26.05.0-beta1, v26.03.1-beta.2
          if [ -z "$RELEASE_TAG" ]; then
            echo "::error::A manual release needs the 'tag' input (e.g. v26.04.0)."
            exit 1
          fi
          if ! printf '%s' "$RELEASE_TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.?[0-9]+)?$'; then
            echo "::error::Tag '$RELEASE_TAG' is not a release tag (expected vX.Y.Z or vX.Y.Z-alphaN/betaN/rcN)."
            exit 1
          fi

          # Only admins may create v* tags (release tag ruleset, #201), so a
          # draft could never be published under a tag that does not exist yet.
          if ! gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" > /dev/null 2>&1; then
            echo "::error::Tag '$RELEASE_TAG' does not exist. Push it before dispatching the release."
            exit 1
          fi

          [ -z "$CI_RUN_ID" ] && exit 0
          if ! printf '%s' "$CI_RUN_ID" | grep -qE '^[0-9]+$'; then
            echo "::error::ci-run-id '$CI_RUN_ID' is not a numeric run ID."
            exit 1
          fi

          # Only a successful CI Build that ran for a push to master may be
          # released; PR builds come from unreviewed branches. Tag builds run
          # inside CI Release (as its build job) and are released by that run.
          RUN=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN_ID" \
            --jq '[.path, .conclusion // "", .event, .head_branch // ""] | @tsv') || {
            echo "::error::CI run $CI_RUN_ID not found in $GITHUB_REPOSITORY."
            exit 1
          }
          IFS=$'\t' read -r RUN_PATH RUN_CONCLUSION RUN_EVENT RUN_BRANCH <<< "$RUN"
          echo "Run $CI_RUN_ID: workflow=$RUN_PATH conclusion=$RUN_CONCLUSION event=$RUN_EVENT branch=$RUN_BRANCH"

          if [ "$RUN_PATH" != ".github/workflows/ci-build.yml" ]; then
            echo "::error::CI run $CI_RUN_ID is from $RUN_PATH, not the CI Build workflow (branch '$RUN_BRANCH', event '$RUN_EVENT')."
            exit 1
          fi
          if [ "$RUN_CONCLUSION" != "success" ]; then
            echo "::error::CI run $CI_RUN_ID did not succeed (conclusion '$RUN_CONCLUSION', branch '$RUN_BRANCH', event '$RUN_EVENT')."
            exit 1
          fi
          if [ "$RUN_EVENT" != "push" ] || [ "$RUN_BRANCH" != "master" ]; then
            echo "::error::CI run $CI_RUN_ID was triggered by '$RUN_EVENT' on branch '$RUN_BRANCH'; only a push to master can be released."
            exit 1
          fi
          echo "ci_run_id=$CI_RUN_ID" >> "$GITHUB_OUTPUT"

      # Download artifacts from the build job or from a previous run
      - name: Download artifacts (from build job)
        if: github.event_name == 'push'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1

      - name: Download artifacts (last successful CI build)
        if: github.event_name == 'workflow_dispatch' && !github.event.inputs.ci-run-id
        uses: dawidd6/action-download-artifact@d63b86af1b34672e53c440b1b83979861906bad7 # v24
        with:
          workflow: ci-build.yml
          workflow_conclusion: success
          # "Last successful" must not pick a pull_request build (#197).
          branch: master
          event: push

      - name: Download artifacts (specific CI run)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.ci-run-id
        uses: dawidd6/action-download-artifact@d63b86af1b34672e53c440b1b83979861906bad7 # v24
        with:
          workflow: ci-build.yml
          run_id: ${{ steps.dispatch.outputs.ci_run_id }}

      - name: Read version
        id: version
        run: |
          set -euo pipefail
          VERSION=$(cat logsquirl_version/logsquirl_version.txt)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "LOGSQUIRL_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Resolve tag
        id: tag
        env:
          # Via env, not interpolated: the tag is user input (#197).
          RELEASE_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="$RELEASE_TAG"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          if echo "$TAG" | grep -qE '(-beta|-alpha|-rc)'; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Resolved tag=$TAG"

      - name: Display downloaded artifacts
        run: ls -R ./packages-*

      # Re-upload merged artifacts so downstream jobs can access them
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-artifacts
          path: |
            packages-*/**
            logsquirl_version/**
            sbom-base/**

  # ── Job 3: Sentry release + symbol upload ──────────────────────────────
  sentry:
    runs-on: ubuntu-24.04
    needs: [prepare]
    # always(): on a manual release validate-branch and build are skipped, and
    # a job without a status function is skipped with any skipped ancestor.
    if: always() && needs.prepare.result == 'success' && needs.prepare.outputs.version != ''
    permissions:
      contents: read
    continue-on-error: true
    # Slowest successful run 3 min (#218).
    timeout-minutes: 15
    env:
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_TOKEN }}
      SENTRY_ORG: logsquirl
      SENTRY_PROJECT: logsquirl
      LOGSQUIRL_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Skip if no Sentry token
        if: ${{ !env.SENTRY_AUTH_TOKEN }}
        run: echo "::warning::SENTRY_TOKEN not set — skipping Sentry release" && exit 0

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifacts

      # A pinned sentry-cli release checked against its SHA-256 (#200, #211).
      - uses: ./.github/actions/install-sentry-cli

      - name: Create Sentry release
        run: |
          set -euo pipefail
          sentry-cli releases new "$LOGSQUIRL_VERSION"
          sentry-cli releases set-commits --auto "$LOGSQUIRL_VERSION"

      - name: Upload symbols linux
        run: |
          set -euo pipefail
          for id in noble oracle fedora appimage; do
            if [ -f "./packages-${id}/logsquirl_${id}.debug.xz" ]; then
              xz -d "./packages-${id}/logsquirl_${id}.debug.xz"
              sentry-cli upload-dif "./packages-${id}/logsquirl_${id}.debug" "./packages-${id}/logsquirl_${id}"
            fi
          done

      - name: Upload symbols mac
        run: |
          set -euo pipefail
          # One command per line: set -e ignores a failure inside an && list (#218).
          cd ./packages-mac-arm64
          tar xzf logsquirl-arm64.app.tar.gz
          tar xzf logsquirl-arm64.dSym.tar.gz
          cd ..
          sentry-cli upload-dif ./packages-mac-arm64/logsquirl.app/Contents/MacOS/logsquirl ./packages-mac-arm64/logsquirl.dSym

      - name: Upload symbols win
        run: |
          sentry-cli upload-dif ./packages-windows-x64/logsquirl-win-x64-pdb.zip

  # ── Job 4: SBOM ────────────────────────────────────────────────────────
  # Completes the source SBOM that CI Build generated from the commit it built
  # (sbom-base: CPM packages and pinned platform components) with what the
  # built packages bundle: the Qt, OpenSSL and ICU versions found in the
  # AppImage, the Windows portable zip and the macOS app, and whatever syft
  # finds in them. Taking the source part from the build run, not from this
  # workflow's checkout, keeps it right for a manual release of an older run.
  # Packages are only unpacked, never executed, and this job holds no write
  # permission (#212).
  sbom:
    runs-on: ubuntu-24.04
    # Unpacking three packages and a syft scan; no run history yet (#218).
    timeout-minutes: 20
    needs: [prepare]
    # always(): on a manual release validate-branch and build are skipped, and
    # a job without a status function is skipped with any skipped ancestor.
    if: always() && needs.prepare.result == 'success' && needs.prepare.outputs.version != ''
    permissions:
      contents: read
    env:
      LOGSQUIRL_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifacts

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install SBOM tooling
        run: |
          pip install --require-hashes -r scripts/sbom/requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y -qq squashfs-tools

      - name: Unpack the packages that bundle libraries
        run: |
          set -euo pipefail
          shopt -s nullglob
          if [ ! -f sbom-base/logsquirl-sbom-base.cdx.json ]; then
            echo "::error::The CI Build run has no sbom-base artifact (it predates #212); release a newer run."
            exit 1
          fi
          # Exactly one package per kind, or the scan would describe the wrong file.
          appimage=(./packages-appimage/*.AppImage)
          portable=(./packages-windows-x64/*-portable.zip)
          macapp=(./packages-mac-arm64/*.app.tar.gz)
          for n in "${#appimage[@]}" "${#portable[@]}" "${#macapp[@]}"; do
            if [ "$n" -ne 1 ]; then
              echo "::error::Expected one AppImage, portable zip and macOS app archive: ${appimage[*]} ${portable[*]} ${macapp[*]}"
              exit 1
            fi
          done
          scan="$RUNNER_TEMP/sbom-scan"
          mkdir -p "$scan/windows" "$scan/macos"
          # The SquashFS payload is read at its offset instead of running the
          # AppImage with --appimage-extract.
          offset=$(python scripts/sbom/logsquirl_sbom.py appimage-offset "${appimage[0]}")
          unsquashfs -no-progress -no-xattrs -o "$offset" -d "$scan/appimage" "${appimage[0]}" > /dev/null
          unzip -q "${portable[0]}" -d "$scan/windows"
          tar -xzf "${macapp[0]}" -C "$scan/macos"

      - name: Scan the packages with syft
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: ${{ runner.temp }}/sbom-scan
          format: cyclonedx-json
          output-file: ${{ runner.temp }}/syft.cdx.json
          upload-artifact: false
          upload-release-assets: false

      # --require-detected: a packaging change that stops bundling (or moves)
      # Qt, OpenSSL or ICU must be looked at, not silently leave them unversioned.
      - name: Merge and validate the release SBOM
        run: |
          set -euo pipefail
          scan="$RUNNER_TEMP/sbom-scan"
          sbom="sbom/logsquirl-${LOGSQUIRL_VERSION}-sbom.cdx.json"
          python scripts/sbom/logsquirl_sbom.py merge --base sbom-base/logsquirl-sbom-base.cdx.json \
            --scan "appimage=$scan/appimage" --scan "windows=$scan/windows" --scan "macos=$scan/macos" \
            --syft "$RUNNER_TEMP/syft.cdx.json" --require-detected qt,openssl,icu --output "$sbom"
          python scripts/sbom/logsquirl_sbom.py validate "$sbom"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-sbom
          path: sbom/*.cdx.json
          if-no-files-found: error

  # ── Job 5: Vulnerability scan ──────────────────────────────────────────
  # Scans the release SBOM: grype matches the components with a CPE (Qt,
  # Boost and the Qt, OpenSSL and ICU builds found in the packages), OSV the
  # CPM packages by pinned commit and tag. A critical finding (CVSS v3/v4 base
  # score >= 9.0 or rated critical) that scripts/sbom/vuln-ignore.yml does not
  # accept fails this job, and the release job does not run. Every finding goes
  # to code scanning, also when the gate fails (#213).
  vuln-scan:
    runs-on: ubuntu-24.04
    # grype database download plus a few OSV requests; no run history yet (#218).
    timeout-minutes: 15
    needs: [prepare, sbom]
    # always(): see the sbom job; a manual release skips validate-branch and build.
    if: always() && needs.sbom.result == 'success'
    permissions:
      contents: read
      security-events: write # upload the SARIF to code scanning
    steps:
      # The scanner comes from this workflow's ref; the ignore file always
      # comes from master. A release tag cannot be moved (#201), so a risk
      # accepted on master through a reviewed PR must also reach a re-run of
      # a tag release (#213).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Take the ignore file from master
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/contents/scripts/sbom/vuln-ignore.yml?ref=master" \
            -H "Accept: application/vnd.github.raw" > scripts/sbom/vuln-ignore.yml

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-sbom
          path: release-sbom

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install SBOM tooling
        run: pip install --require-hashes -r scripts/sbom/requirements.txt

      - name: Scan the release SBOM
        uses: ./.github/actions/sbom-vuln-scan
        with:
          sbom: release-sbom/logsquirl-${{ needs.prepare.outputs.version }}-sbom.cdx.json
          sarif: sbom-vulns.sarif
          fail-on: critical

      - name: Upload to code scanning
        if: ${{ !cancelled() && hashFiles('sbom-vulns.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: sbom-vulns.sarif
          category: sbom-vulns

  # ── Job 6: Publish GitHub Release ──────────────────────────────────────
  release:
    runs-on: ubuntu-24.04
    needs: [prepare, sentry, sbom, vuln-scan]
    # sentry may fail (continue-on-error); a release without its SBOM, or with
    # a critical vulnerability nobody accepted, may not (#212, #213).
    if: >-
      always() && needs.prepare.result == 'success' && needs.sbom.result == 'success'
      && needs.vuln-scan.result == 'success'
    # Slowest successful run 5 min, mostly asset uploads (#218).
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      LOGSQUIRL_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifacts

      # Its own asset directory, so the checksum file, the upload and the
      # provenance attestation cover the SBOM like every other asset (#212).
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-sbom
          path: packages-sbom

      - name: Cleanup release artifacts
        run: |
          set -euo pipefail
          # Remove uncompressed binaries (only keep packages)
          for id in noble oracle fedora appimage; do
            rm -f "./packages-${id}/logsquirl_${id}"
          done

          # Remove extracted app/dSym bundles (keep tar.gz archives)
          rm -rf ./packages-mac-arm64/logsquirl.app ./packages-mac-arm64/logsquirl.dSym

          # Collect debug symbols into a single archive. A platform without
          # symbols is skipped, but a failing xz or mv stops the release instead
          # of being swallowed by a trailing `|| true` (#218).
          mkdir -p ./linux-debug
          for id in noble oracle fedora appimage; do
            if [ -f "./packages-${id}/logsquirl_${id}.debug" ]; then
              mv "./packages-${id}/logsquirl_${id}.debug" ./linux-debug/
            fi
            if [ -f "./packages-${id}/logsquirl_${id}.debug.xz" ]; then
              xz -d "./packages-${id}/logsquirl_${id}.debug.xz"
              mv "./packages-${id}/logsquirl_${id}.debug" ./linux-debug/
            fi
          done
          if ls ./linux-debug/*.debug 1>/dev/null 2>&1; then
            tar -cJf ./logsquirl-$LOGSQUIRL_VERSION-symbols.tar.xz -C ./linux-debug .
            rm -f ./linux-debug/*.debug
            mv ./logsquirl-$LOGSQUIRL_VERSION-symbols.tar.xz ./linux-debug/
          fi

      - name: Prepare binary artifacts
        run: |
          set -euo pipefail
          mkdir -p ./packages-bin
          # The deps archive is optional; a failing mv is not (#218).
          if [ -f "./packages-appimage/logsquirl_deps.tar.xz" ]; then
            mv ./packages-appimage/logsquirl_deps.tar.xz "./packages-bin/logsquirl-$LOGSQUIRL_VERSION-deps.tar.xz"
          fi
          cp ./logsquirl_version/logsquirl_version.txt ./packages-bin/

      - name: Prepare checksums
        id: assets
        run: |
          set -euo pipefail
          shopt -s nullglob

          # The one list of directories whose files become release assets. The
          # publish step takes its globs from this step's output, so the checksum
          # file and the uploaded assets cannot drift apart (#196).
          required_dirs=(packages-windows-x64 packages-noble packages-oracle
                         packages-fedora packages-appimage packages-mac-arm64
                         packages-bin packages-sbom)
          # Symbols are only archived when a Linux build produced .debug files.
          optional_dirs=(linux-debug)
          checksum_name="logsquirl-${LOGSQUIRL_VERSION}-sha256.txt"

          # A platform that did not deliver must stop the release, not ship a
          # release (and checksum file) without it (#196).
          missing=0
          for dir in "${required_dirs[@]}"; do
            found=0
            for f in "./$dir"/*; do
              if [ -f "$f" ]; then found=1; break; fi
            done
            if [ "$found" -eq 0 ]; then
              echo "::error::Release asset directory '$dir' is missing or has no files"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1

          # Entries use basenames: users verify with 'sha256sum -c' inside the
          # folder they downloaded the assets to. Release assets share one flat
          # namespace, so a duplicate name would also clobber an upload.
          names=()
          checksums="$RUNNER_TEMP/$checksum_name"
          : > "$checksums"
          for dir in "${required_dirs[@]}" "${optional_dirs[@]}"; do
            for f in "./$dir"/*; do
              [ -f "$f" ] || continue
              name="${f##*/}"
              [ "$name" != "$checksum_name" ] || continue
              names+=("$name")
              (cd "./$dir" && sha256sum --binary -- "$name") >> "$checksums"
            done
          done
          duplicates=$(printf '%s\n' "${names[@]}" | sort | uniq -d)
          if [ -n "$duplicates" ]; then
            echo "::error::Release asset names are not unique: $duplicates"
            exit 1
          fi
          mv "$checksums" "./packages-bin/$checksum_name"
          cat "./packages-bin/$checksum_name"
          # The signing step signs this file; its bundle is not a checksum entry (#214).
          echo "checksum_file=./packages-bin/$checksum_name" >> "$GITHUB_OUTPUT"

          {
            echo "files<<RELEASE_ASSET_GLOBS"
            for dir in "${required_dirs[@]}" "${optional_dirs[@]}"; do
              echo "./$dir/*"
            done
            echo "RELEASE_ASSET_GLOBS"
            # The SBOM attestation binds the SBOM to every other asset (#212).
            echo "sbom_subjects<<SBOM_SUBJECT_GLOBS"
            for dir in "${required_dirs[@]}" "${optional_dirs[@]}"; do
              [ "$dir" = packages-sbom ] || echo "./$dir/*"
            done
            echo "SBOM_SUBJECT_GLOBS"
          } >> "$GITHUB_OUTPUT"
          sbom_files=(./packages-sbom/*.cdx.json)
          if [ "${#sbom_files[@]}" -ne 1 ]; then
            echo "::error::Expected one SBOM in packages-sbom, found ${#sbom_files[@]}"
            exit 1
          fi
          echo "sbom_file=${sbom_files[0]}" >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        id: changelog
        run: |
          python3 scripts/gen_changelog.py > release_notes.md 2>/dev/null || echo "See commit history for changes." > release_notes.md

      # The verification commands name this release's files, so they are added
      # here rather than in gen_changelog.py, which knows nothing about assets (#214).
      - name: Append verification instructions
        run: |
          set -euo pipefail
          # A quoted heredoc written to a file (not captured with $(...)) keeps
          # the backslash line continuations of the commands intact.
          template="$RUNNER_TEMP/verifying-downloads.md"
          cat > "$template" <<'NOTES'

          ## Verifying downloads

          Every download is listed in `logsquirl-@VERSION@-sha256.txt`. The
          checksum file is signed with Sigstore (`logsquirl-@VERSION@-sha256.txt.sigstore.json`,
          which is itself not listed in the checksum file), and every asset carries a
          GitHub build provenance attestation. `logsquirl-@VERSION@-sbom.cdx.json` is the
          CycloneDX software bill of materials of this release, attested for every download.

          ```sh
          # 1. Check the signature of the checksum file (needs cosign)
          cosign verify-blob \
            --bundle logsquirl-@VERSION@-sha256.txt.sigstore.json \
            --certificate-identity-regexp '^https://github\.com/64x-lunicorn/LogSquirl/\.github/workflows/ci-release\.yml@refs/(tags/v.+|heads/master)$' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            logsquirl-@VERSION@-sha256.txt

          # 2. Check the files you downloaded against it
          sha256sum -c logsquirl-@VERSION@-sha256.txt --ignore-missing

          # 3. Or check a single file's build provenance (needs the GitHub CLI)
          gh attestation verify <file> -R 64x-lunicorn/LogSquirl

          # 4. Check that the SBOM describes that file
          gh attestation verify <file> -R 64x-lunicorn/LogSquirl --predicate-type https://cyclonedx.org/bom
          ```
          NOTES
          section=$(cat "$template")
          printf '%s\n' "${section//@VERSION@/$LOGSQUIRL_VERSION}" >> release_notes.md

      # Publish as a draft first: provenance and signature are created while
      # the release is still invisible, and a failure in any later step leaves
      # a draft instead of a public release without them. A re-run reuses the
      # draft for the same tag (#214). zizmor suggests `gh release` instead; the
      # action's reuse of an existing draft and its multi-line globs would have
      # to be rebuilt in shell, so it stays (#204).
      - name: Create draft release # zizmor: ignore[superfluous-actions]
        id: draft
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: "LogSquirl ${{ needs.prepare.outputs.tag }}"
          body_path: release_notes.md
          prerelease: ${{ needs.prepare.outputs.is_prerelease == 'true' }}
          draft: true
          # Same directory list the checksum file was computed from (#196)
          files: ${{ steps.assets.outputs.files }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Every uploaded asset, the checksum file included, gets a provenance
      # attestation: the subjects are the same globs the draft was built from,
      # so a new asset directory (e.g. an SBOM) is covered automatically (#214).
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.assets.outputs.files }}

      # actions/attest-sbom is deprecated in favour of actions/attest, which
      # takes the same sbom-path input. Verify with
      # gh attestation verify <file> --predicate-type https://cyclonedx.org/bom (#212)
      - name: Attest SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.assets.outputs.sbom_subjects }}
          sbom-path: ${{ steps.assets.outputs.sbom_file }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Keyless signature over the checksum file, bound to this workflow's
      # identity: ci-release.yml@refs/tags/v* for a tag push, @refs/heads/master
      # for a manual release dispatched from master (the regexp in the release
      # notes accepts exactly these two). The bundle is created after the checksum file, so it is not
      # (and cannot be) listed in it; users verify it with cosign instead (#214).
      - name: Sign checksum file
        env:
          CHECKSUM_FILE: ${{ steps.assets.outputs.checksum_file }}
        run: |
          set -euo pipefail
          # Written outside the asset directories, so no asset glob can pick it up.
          bundle="$RUNNER_TEMP/${CHECKSUM_FILE##*/}.sigstore.json"
          cosign sign-blob --yes --bundle "$bundle" "$CHECKSUM_FILE"

      - name: Upload signature bundle
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
          CHECKSUM_FILE: ${{ steps.assets.outputs.checksum_file }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" "$RUNNER_TEMP/${CHECKSUM_FILE##*/}.sigstore.json" --clobber

      # Last step: only a release with attestations and a signed checksum file
      # becomes public, and update-metadata only runs once this succeeded (#214).
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_ID: ${{ steps.draft.outputs.id }}
        run: |
          set -euo pipefail
          gh api --method PATCH "repos/$GH_REPO/releases/$RELEASE_ID" -F draft=false --jq '.html_url'

  # ── Job 7: Update latest.json ──────────────────────────────────────────
  update-metadata:
    runs-on: ubuntu-24.04
    needs: [prepare, release]
    if: needs.release.result == 'success'
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      # The only checkout that keeps its credentials: the job pushes the
      # updated latest.json with them, and it uploads no artifact that could
      # leak them (#204).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          persist-credentials: true # zizmor: ignore[artipacked]

      - name: Update latest.json
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          IS_PRERELEASE: ${{ needs.prepare.outputs.is_prerelease }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          URL="https://github.com/64x-lunicorn/LogSquirl/releases/tag/${TAG}"

          # jq and mv are separate commands: set -e ignores a failure inside an
          # && list, and a failed jq used to end in a green job that committed
          # nothing (#218).
          if [ "$IS_PRERELEASE" = "true" ]; then
            jq --arg ver "$VERSION" --arg url "$URL" \
               '.beta = $ver | .beta_url = $url | .beta_version = $ver' latest.json > latest.json.tmp
            COMMIT_MSG="chore: update latest.json with beta ${VERSION} [skip ci]"
          else
            jq --arg ver "$VERSION" --arg url "$URL" \
               '.stable = $ver | .stable_url = $url | .stable_version = $ver' latest.json > latest.json.tmp
            COMMIT_MSG="chore: update latest.json with ${VERSION} [skip ci]"
          fi
          mv latest.json.tmp latest.json

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add latest.json
          if ! git diff --cached --quiet; then
            git commit -m "$COMMIT_MSG"
          fi
          git push

   
