# Deploy Starlight (Astro) website to Netcup Webhosting via FTPS
name: Deploy Website

on:
  # The only trigger: CI Release dispatches this once a release is published,
  # so the site and that release's page go live with it (#315). A website
  # change merged to master deliberately does not deploy on its own; it waits
  # for the next release (#350). That such a change builds and its links hold
  # is checked per pull request by CI Build's Website job (#311).
  #
  # The nightly Performance run dispatches it too, with performance_trend, once
  # it has recorded a run of master on the perf-data branch (#678). That
  # rebuilds the site of the last published release with the new run on its
  # Performance page: the website code stays the release's, so #350 holds.
  workflow_dispatch:
    inputs:
      performance_trend:
        description: "Rebuild the last published release's site with the newest performance runs, instead of building master"
        type: boolean
        default: false

# Only one deploy at a time, and never cancel one mid-upload: two
# interleaved syncs against the same server-dir leave a mixed site and a
# sync-state file that no longer matches the server (#206).
concurrency:
  group: deploy-website
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  deploy:
    # Pinned so a runner image bump cannot silently change the deploy (#206).
    runs-on: ubuntu-24.04
    # The FTP credentials are secrets of the `website` environment, whose
    # deployment policy admits only master (#203): a dispatch from any other
    # branch fails before a step runs instead of deploying that branch.
    environment: website
    # A stuck FTP connection would otherwise hold the concurrency group for
    # the default 6 hours (#206).
    timeout-minutes: 20
    steps:
      # A release deploys master as it is; the nightly update rebuilds what
      # the last release deployed, the newest GitHub release that is not a
      # draft (a beta deploys as well), so no website change of master since
      # then goes live with it (#350, #678).
      - name: Choose the code to build
        id: site
        env:
          GH_TOKEN: ${{ github.token }}
          PERFORMANCE_TREND: ${{ inputs.performance_trend }}
        run: |
          set -euo pipefail
          if [ "$PERFORMANCE_TREND" != true ]; then
            echo "Building $GITHUB_REF_NAME"
            exit 0
          fi
          tag=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=30" \
            --jq '[.[] | select(.draft | not)] | sort_by(.published_at) | last | .tag_name // empty')
          if [ -z "$tag" ]; then
            echo "::error::No published release to rebuild the site of"
            exit 1
          fi
          echo "Rebuilding the site of $tag with the newest performance runs"
          echo "ref=refs/tags/$tag" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.site.outputs.ref }}
          persist-credentials: false

      # The Performance page draws the runs of the perf-data branch (#678;
      # website/src/perf-trend.mjs). Without the branch the page says it has
      # no runs, and the site deploys all the same.
      - name: Check out the performance history
        id: perf_data
        run: |
          set -euo pipefail
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          dir="$RUNNER_TEMP/perf-data"
          if git ls-remote --exit-code --heads "$url" perf-data > /dev/null; then
            git clone --quiet --depth 1 --single-branch --branch perf-data "$url" "$dir"
            echo "dir=$dir" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::There is no perf-data branch; the Performance page shows no runs"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: cd website && npm ci

      # A release page goes live with its GitHub release: the page of a
      # release not published yet is left out of this build (#315). A failed
      # listing fails the deploy instead of leaving out every release.
      - name: Leave out the pages of unpublished releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq '.[] | select(.draft | not) | .tag_name' > "$RUNNER_TEMP/published-releases.txt"
          cd website && node scripts/leave-out-unpublished.mjs "$RUNNER_TEMP/published-releases.txt"

      - name: Build
        env:
          LOGSQUIRL_PERF_DATA: ${{ steps.perf_data.outputs.dir }}
        run: cd website && npm run build

      # The pin is the v4.4.0 tag's commit. The action repository also has a
      # branch named v4.4.0 on another commit, which zizmor resolves instead
      # (#204).
      - name: Deploy via FTPS # zizmor: ignore[ref-version-mismatch]
        uses: SamKirkland/FTP-Deploy-Action@110f9186c050f71550953127052e77650219c287 # v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # `ftps` is explicit TLS on the normal control port 21, which is
          # what Netcup webhosting offers; the default `ftp` sent credentials
          # and content in clear text (#206).
          protocol: ftps
          port: 21
          # The action defaults to `loose`, which accepts any certificate and
          # so any server posing as FTP_SERVER. `strict` verifies the chain
          # and the host name; a deploy failing with a certificate error
          # means FTP_SERVER does not name the host the certificate is for
          # (#230).
          security: strict
          local-dir: website/dist/
          server-dir: /
          # No dangerous-clean-slate: it wiped the server before every upload,
          # so the site was down during the upload and a failed upload left
          # it empty. The action's sync-state file on the server
          # (.ftp-deploy-sync-state.json) drives an incremental sync that
          # also deletes files removed from dist/ (#206).
